<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Weigh to Go · prototype (Sprint 2 design)</title>
    <!--
  Prototype of docs/ux/design.md. Not shipped: inline styles, innerHTML and the ?query routing are
  prototype shortcuts (design.md, section 16, lists what not to copy). Made-up data only.
  Strings that the product already has are quoted word for word from src/i18n/messages.ts; new
  strings are the design's proposals for new keys.
  One responsive file: tabs below 960 px, one page at 960 px and wider.
  Query parameters set a state for screenshots:
    tab=today|progress|analysis|data   empty=1   lang=pt   unit=lb   theme=light|dark   text=150|200
    saved=1 (just saved)   logged=1 (today already logged)   sheet=chart|pct|sections|day|paste|erase
    open=pct,...   all=1   scrub=<days back>   finger=1
    app=1 (iPhone app: root 17 px as Dynamic Type's default)   ad=1 (app with a banner)   dt=<px> (Dynamic Type size, capped at 34 px)
    iap=ready|buying|pending|failed|offline|bought|restore-none   notif=denied   health=on|zero|readfail|denied|none   notif=failed   erased=nothealth   consent=1
    aside=1 (diary kept aside)   reload=1 (the app's "Try again" notice)
-->
    <style>
      @font-face {
        font-family: 'Barlow';
        font-weight: 400;
        font-display: swap;
        src: url(fonts/barlow-latin-400-normal.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Barlow';
        font-weight: 500;
        font-display: swap;
        src: url(fonts/barlow-latin-500-normal.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Barlow';
        font-weight: 600;
        font-display: swap;
        src: url(fonts/barlow-latin-600-normal.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Barlow Condensed';
        font-weight: 500;
        font-display: swap;
        src: url(fonts/barlow-condensed-latin-500-normal.woff2) format('woff2');
      }
      @font-face {
        font-family: 'Barlow Condensed';
        font-weight: 600;
        font-display: swap;
        src: url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2');
      }

      /* ---------- Tokens: today's, plus the new ones marked NEW ---------- */
      :root {
        --bg: #f2f5f6;
        --panel: #ffffff;
        --fg: #1a2227;
        --muted: #5b6870;
        --line: #dae1e4;
        --soft: #e8edef;
        --accent: #2f6690;
        --on-accent: #ffffff;
        --ok: #2b7f4f;
        --bad: #bf4038;
        --c-weight: #2f6690;
        --c-avg7: #cc7420;
        --c-trend: #8253ac;
        --c-week: #3b8686;
        --c-reg: #6a7883;
        --c-proj: #be3a73;
        --grid: #e5eaec;
        --axis: #b6c0c5;
        --ref: #85929a;
        --shadow: 0 8px 28px rgb(20 32 42 / 0.14);
        --cal-d1: #6e94c4;
        --cal-d2: #4a78b3;
        --cal-d3: #2c5d9a;
        --cal-u1: #c4762e;
        --cal-u2: #a95d17;
        --cal-u3: #8a4609;
        /* NEW: direction, neutral (decision 7): a fall in blue, a rise in orange; red only for errors. */
        --down: #2c5d9a;
        --up: #9a5410;
        --up-soft: rgb(196 118 46 / 0.16);
        /* NEW: the shell. --tab-h is measured from the bar by a ResizeObserver; this is its first value. */
        --tab-h: 56px;
        --ad-h: 0px;
        --scrim: rgb(15 20 23 / 0.42);
        --sheet: #ffffff;
        --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --f-num: 'Barlow Condensed', 'Barlow', system-ui, sans-serif;
        --r: 10px;
        color-scheme: light;
      }
      :root.dark {
        --bg: #0f1417;
        --panel: #172025;
        --fg: #e3e9ec;
        --muted: #92a0a8;
        --line: #28333a;
        --soft: #1f292f;
        --accent: #74aad9;
        --on-accent: #0f1417;
        --ok: #57bf87;
        --bad: #ea786e;
        --c-weight: #74aad9;
        --c-avg7: #efa15b;
        --c-trend: #b58bdc;
        --c-week: #6cc0be;
        --c-reg: #98a6b0;
        --c-proj: #eb71a7;
        --grid: #222c32;
        --axis: #3c484f;
        --ref: #7c8992;
        --shadow: 0 8px 28px rgb(0 0 0 / 0.5);
        --cal-d1: #4f7fb8;
        --cal-d2: #6f9ad0;
        --cal-d3: #94b8e4;
        --cal-u1: #a8661f;
        --cal-u2: #c98236;
        --cal-u3: #e3a35e;
        --down: #94b8e4;
        --up: #e3a35e;
        --up-soft: rgb(227 163 94 / 0.16);
        --scrim: rgb(0 0 0 / 0.6);
        --sheet: #1b252b;
        color-scheme: dark;
      }
      :root.ad {
        --ad-h: 50px;
      }
      :root.text150 {
        font-size: 150%;
      }
      /* The app's starting size, before the script reads Dynamic Type (the product: the probe of design §12). */
      :root.app {
        font-size: 17px;
      }
      :root.text200 {
        font-size: 200%;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        /* Focused controls never end up under the fixed bars (WCAG 2.4.11). */
        scroll-padding-top: calc(env(safe-area-inset-top, 0px) + var(--ad-h) + 12px);
        scroll-padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 12px);
      }
      body {
        margin: 0;
        min-height: 100svh;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--f-body);
        font-size: 0.9375rem;
        line-height: 1.45;
        overflow-wrap: break-word;
      }
      /* In the app, the Keyboard plugin's resize: 'body' sets the body's height; a minimum would defeat it. */
      :root.app body {
        min-height: 0;
      }
      a {
        color: var(--accent);
        text-underline-offset: 3px;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      button {
        font: inherit;
        color: inherit;
      }
      .skip-link {
        position: absolute;
        left: 16px;
        top: 8px;
        transform: translateY(-200%);
        padding: 8px 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        z-index: 50;
      }
      /* Below the status bar and the banner, never under them. */
      .skip-link:focus {
        transform: none;
        top: calc(max(8px, env(safe-area-inset-top, 0px)) + var(--ad-h) + 8px);
      }

      /* ---------- The iPhone app: the status-bar band, and the banner's space (Sprint 4) ---------- */
      /* The app's build writes class="app" on <html> in index.html, so CSS knows before the first paint. */
      .ad-space {
        position: fixed;
        z-index: 40;
        inset: 0 0 auto 0;
        height: calc(env(safe-area-inset-top, 0px) + var(--ad-h));
        padding-top: env(safe-area-inset-top, 0px);
        background: var(--bg);
        display: none;
        justify-content: center;
        align-items: stretch;
      }
      :root.app .ad-space {
        display: flex;
      }
      .ad-slot {
        width: min(320px, 100%);
        border: 1px dashed var(--ref);
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: var(--muted);
        background: repeating-linear-gradient(135deg, transparent 0 8px, var(--soft) 8px 16px);
      }
      :root:not(.ad) .ad-slot {
        display: none;
      }
      /* The native banner is hidden while a sheet is open or the keypad is up; the band stays, empty. */
      :root.sheet-open .ad-slot,
      :root.typing .ad-slot {
        visibility: hidden;
      }

      /* ---------- Header and the tab bar ---------- */
      .appbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: calc(max(10px, env(safe-area-inset-top, 0px)) + var(--ad-h))
          max(16px, env(safe-area-inset-right, 0px)) 2px max(16px, env(safe-area-inset-left, 0px));
        min-height: 52px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        font-family: var(--f-num);
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--fg);
        text-decoration: none;
        white-space: nowrap;
      }
      .brand svg {
        width: 26px;
        height: 26px;
        flex: none;
      }
      /* Styled only once the script has filled it: with scripts off there is no empty bar. */
      .tabs:empty {
        display: none;
      }
      .tabs {
        position: fixed;
        z-index: 30;
        left: 0;
        right: 0;
        bottom: 0;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        background: var(--panel);
        border-top: 1px solid var(--line);
        padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px)
          env(safe-area-inset-left, 0px);
      }
      /* The bar's labels stop growing at 150% (19.5 px), as iOS's own tab bars do. */
      .tabs a {
        position: relative;
        min-height: 56px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding: 6px 2px;
        color: var(--muted);
        text-decoration: none;
        font-size: min(0.8125rem, 19.5px);
        line-height: 1.1;
        text-align: center;
        overflow-wrap: anywhere;
        -webkit-tap-highlight-color: transparent;
      }
      .tabs a svg {
        width: 24px;
        height: 24px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .tabs a[aria-current] {
        color: var(--accent);
        font-weight: 600;
      }
      .tabs a[aria-current]::before {
        content: '';
        position: absolute;
        top: 0;
        left: 22%;
        right: 22%;
        height: 3px;
        border-radius: 0 0 3px 3px;
        background: var(--accent);
      }
      .tabs a[aria-current] svg {
        stroke-width: 2.4;
      }
      .tabs .dot {
        position: absolute;
        top: 7px;
        left: calc(50% + 8px);
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--c-avg7);
        border: 2px solid var(--panel);
      }
      /* While a text field has focus (the keypad is up), the bar steps aside. */
      :root.typing .tabs {
        display: none;
      }
      /* Landscape phone: a lower bar, icon beside the label. */
      @media (orientation: landscape) and (max-height: 500px) and (max-width: 959px) {
        .tabs a {
          flex-direction: row;
          min-height: 44px;
          gap: 6px;
        }
        .tabs a[aria-current]::before {
          left: 10%;
          right: 10%;
        }
      }

      main {
        padding: 4px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
      }
      :root.has-tabs main {
        padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 24px);
      }
      .view {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .view:not(.current) {
        display: none;
      }
      .view-title {
        margin: 4px 0 0;
        font-family: var(--f-num);
        font-weight: 500;
        font-size: 1.75rem;
        line-height: 1.1;
      }
      .view-title:focus {
        outline: none;
      }
      .lede {
        margin: 0;
        color: var(--muted);
      }
      .site-footer {
        display: none;
      }

      /* ---------- Cards, figures, text ---------- */
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 16px;
        min-width: 0;
      }
      .card h2 {
        margin: 0;
        font-family: var(--f-num);
        font-weight: 500;
        font-size: 1.375rem;
        line-height: 1.15;
      }
      .eyebrow {
        margin: 0;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .take {
        margin: 4px 0 0;
        font-size: 1.0625rem;
      }
      .take b {
        font-weight: 600;
      }
      .note {
        margin: 4px 0 0;
        font-size: 0.875rem;
        color: var(--muted);
      }
      .down {
        color: var(--down);
      }
      .up {
        color: var(--up);
      }
      .notice {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        align-items: center;
        padding: 12px 14px;
        border: 1px solid var(--c-avg7);
        border-radius: var(--r);
        background: var(--panel);
      }
      .notice p {
        margin: 0;
        flex: 1 1 16rem;
      }
      .kpis {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .kpis-6 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .kpi {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }
      .kpi-label {
        font-size: 0.8125rem;
        color: var(--muted);
        line-height: 1.2;
      }
      .kpi-value {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        column-gap: 2px;
        font-family: var(--f-num);
        font-weight: 500;
        font-size: 1.75rem;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      .kpi-unit {
        font-size: 0.9375rem;
        color: var(--muted);
        margin-left: 2px;
      }
      .kpi-sub {
        font-size: 0.8125rem;
        color: var(--muted);
        line-height: 1.25;
      }
      .kpis-today .kpi {
        padding: 10px;
      }
      .kpis-today .kpi-value {
        font-size: 1.625rem;
      }
      /* Below 20 rem of row (320 px, or text at 150%), the three figures stack as rows of one list. */
      .kpis-wrap {
        container-type: inline-size;
      }
      @container (max-width: 20rem) {
        .kpis-today {
          grid-template-columns: minmax(0, 1fr);
          gap: 0;
          background: var(--panel);
          border: 1px solid var(--line);
          border-radius: var(--r);
        }
        .kpis-today .kpi {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
          column-gap: 10px;
          border: 0;
          border-radius: 0;
          border-bottom: 1px solid var(--line);
          background: none;
          padding: 8px 12px;
        }
        .kpis-today .kpi:last-child {
          border-bottom: 0;
        }
        .kpis-today .kpi-label {
          grid-column: 1;
          grid-row: 1;
        }
        .kpis-today .kpi-sub {
          grid-column: 1;
          grid-row: 2;
        }
        .kpis-today .kpi-value {
          grid-column: 2;
          grid-row: 1 / span 2;
          align-self: center;
          justify-content: flex-end;
          font-size: 1.5rem;
        }
      }

      /* ---------- Today: the sparkline and the weigh-in ---------- */
      /* svh, not dvh: the layout doesn't jump when Safari's bars or the keypad come and go. */
      #view-today {
        min-height: calc(
          100svh - 52px - var(--ad-h) - var(--tab-h) - env(safe-area-inset-bottom, 0px) -
            env(safe-area-inset-top, 0px) - 36px
        );
      }
      .spark {
        flex: 1 1 auto;
        min-height: 120px;
        max-height: 280px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 2px 12px;
        text-decoration: none;
        color: inherit;
        padding: 12px 14px 10px;
      }
      .spark-head {
        font-size: 0.875rem;
        color: var(--muted);
      }
      .spark-more {
        font-size: 0.875rem;
        color: var(--accent);
        align-self: start;
        white-space: nowrap;
      }
      .spark-plot {
        grid-column: 1 / -1;
        min-height: 64px;
        position: relative;
      }
      .spark-plot svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .spark-legend {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 0 12px;
        font-size: 0.8125rem;
        color: var(--muted);
      }
      .spark-legend span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      @media (max-height: 700px) and (max-width: 959px) {
        .spark {
          display: none;
        }
        #view-today {
          min-height: 0;
        }
      }

      .entry {
        padding: 14px 16px 16px;
      }
      .entry-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }
      .date-chip {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
        padding: 0 12px 0 10px;
        border: 1px solid var(--ref);
        border-radius: 22px;
        background: var(--bg);
        font-size: 0.9375rem;
        white-space: nowrap;
      }
      .date-chip svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
      }
      /* Touch: the native date input covers the chip, invisible; a tap opens the system's picker. */
      .date-chip input {
        position: absolute;
        inset: -1px;
        opacity: 0;
        width: calc(100% + 2px);
        height: calc(100% + 2px);
        border: 0;
        font-size: 16px;
      }
      .date-chip:has(:focus-visible) {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      /* Mouse and the desktop layout: a visible date field, as today. */
      .date-field {
        display: none;
        flex-direction: column;
        gap: 2px;
        font-size: 0.875rem;
        color: var(--muted);
      }
      .date-field input {
        font: inherit;
        font-size: max(1rem, 16px);
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--ref);
        border-radius: 8px;
        padding: 6px 8px;
        min-height: 40px;
      }
      @media (pointer: fine), (min-width: 960px) {
        .date-chip {
          display: none;
        }
        .date-field {
          display: flex;
        }
      }
      /* Save is half the card's inner width, beside the field, and never narrower than 120 px. */
      .entry-form {
        margin-top: 10px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(120px, 1fr);
        gap: 10px;
        align-items: end;
      }
      .entry-form > label {
        grid-column: 1 / -1;
        font-size: 0.875rem;
        color: var(--muted);
        margin-bottom: -6px;
      }
      .with-unit {
        position: relative;
        display: flex;
        align-items: center;
      }
      .with-unit input {
        width: 100%;
        min-height: 56px;
        padding: 6px 44px 6px 12px;
        font-family: var(--f-num);
        font-size: 1.75rem;
        font-weight: 500;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--ref);
        border-radius: 10px;
      }
      .with-unit .unit {
        position: absolute;
        right: 12px;
        color: var(--muted);
        font-size: 1rem;
        pointer-events: none;
      }
      .button {
        min-height: 44px;
        min-width: 44px;
        padding: 8px 16px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        text-align: center;
      }
      .button:disabled,
      .button[aria-disabled='true'] {
        opacity: 0.55;
        cursor: default;
      }
      .button-big {
        min-height: 56px;
        font-size: 1.125rem;
      }
      .button-ghost {
        background: transparent;
        color: var(--accent);
        border-color: var(--ref);
      }
      .button-danger {
        background: transparent;
        color: var(--bad);
        border-color: var(--bad);
      }
      .button-text {
        background: none;
        border: 0;
        color: var(--accent);
        font-weight: 600;
        padding: 8px 6px;
        min-height: 44px;
        min-width: 44px;
        cursor: pointer;
      }
      .hint {
        grid-column: 1 / -1;
        margin: 0;
        font-size: 0.875rem;
        color: var(--muted);
      }
      .hint.bad {
        color: var(--bad);
      }
      .saved {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 2px 10px;
        align-items: center;
        margin-top: 10px;
        padding: 10px 10px 10px 12px;
        border-radius: 10px;
        background: var(--soft);
        position: relative;
        overflow: hidden;
      }
      .saved:focus {
        outline: none;
      }
      .saved:focus-visible {
        outline: 2px solid var(--accent);
      }
      .saved svg {
        width: 24px;
        height: 24px;
        stroke: var(--ok);
        fill: none;
        stroke-width: 2.4;
        grid-row: 1 / span 2;
      }
      .saved p {
        margin: 0;
      }
      .saved .sub {
        grid-column: 2;
        font-size: 0.875rem;
        color: var(--muted);
      }
      .saved .button-ghost {
        grid-column: 3;
        grid-row: 1 / span 2;
        background: var(--panel);
      }
      .undo-bar {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 3px;
        background: var(--accent);
        width: 100%;
        transform-origin: left;
        animation: undo 10s linear forwards;
      }
      .undo-bar.paused {
        animation-play-state: paused;
      }
      @keyframes undo {
        to {
          transform: scaleX(0);
        }
      }
      .after-row {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .after-row .button {
        flex: 1 1 8rem;
      }
      .reminder {
        margin: 0;
        display: flex;
        align-items: flex-start;
        gap: 8px;
        font-size: 0.875rem;
        color: var(--muted);
        padding: 0 4px;
      }
      .reminder .dot-inline {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--c-avg7);
        flex: none;
        margin-top: 0.45em;
      }
      .reminder a {
        /* A link inside a sentence: at least 24 px tall (WCAG 2.5.8), so the lines stay together. */
        display: inline-block;
        padding-block: 3px;
        font-weight: 600;
      }
      .intro-text {
        margin: 0;
        font-size: 1.0625rem;
      }
      .privacy {
        margin: 0;
        font-size: 0.875rem;
        color: var(--muted);
      }
      .empty-links {
        display: flex;
        flex-direction: column;
      }
      .empty-links a {
        display: flex;
        align-items: center;
        min-height: 44px;
        font-weight: 600;
      }

      /* ---------- Charts ---------- */
      .card-head {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }
      .card-head > div {
        min-width: 0;
      }
      .options-button {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
        max-width: 100%;
        padding: 0 12px;
        border: 1px solid var(--ref);
        border-radius: 22px;
        background: var(--panel);
        color: var(--fg);
        font-size: 0.875rem;
        cursor: pointer;
      }
      .options-button svg {
        width: 18px;
        height: 18px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
      }
      .options-button b {
        font-weight: 600;
      }
      /* The readout strip: its height is set by script from its longest possible content, so it never moves. */
      .readout {
        margin-top: 10px;
        padding: 6px 10px;
        border-radius: 8px;
        background: var(--soft);
        font-size: 0.875rem;
        line-height: 1.35;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 0 12px;
      }
      .readout .r-day {
        font-weight: 600;
        width: 100%;
      }
      .readout .r-item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .readout .r-item i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
        flex: none;
      }
      .chart-box {
        position: relative;
        margin-top: 6px;
        touch-action: pan-y;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      .chart-box svg {
        display: block;
        width: 100%;
        overflow: visible;
      }
      .chart-box svg:focus {
        outline: none;
      }
      .chart-box svg:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
      }
      .tick {
        fill: var(--muted);
        font-size: 0.75rem;
        font-family: var(--f-num);
      }
      .gridline {
        stroke: var(--grid);
      }
      .axisline {
        stroke: var(--axis);
      }
      .reflabel {
        fill: var(--muted);
        font-size: 0.8125rem;
        font-family: var(--f-num);
      }
      .goal-line {
        stroke: var(--ok);
        stroke-dasharray: 5 4;
        stroke-width: 1.4;
      }
      .goal-label {
        fill: var(--ok);
        font-size: 0.8125rem;
        font-family: var(--f-num);
        font-weight: 600;
      }
      .bmi-line {
        stroke: var(--ref);
        stroke-dasharray: 2 4;
      }
      .l-points {
        fill: var(--c-weight);
      }
      .l-line {
        stroke: var(--c-weight);
        fill: none;
        stroke-width: 1;
        opacity: 0.6;
      }
      .l-avg7 {
        stroke: var(--c-avg7);
        fill: none;
        stroke-width: 2.2;
      }
      .l-trend {
        stroke: var(--c-trend);
        fill: none;
        stroke-width: 2;
        stroke-dasharray: 6 3;
      }
      .l-weekly {
        stroke: var(--c-week);
        fill: none;
        stroke-width: 2;
      }
      .l-reg {
        stroke: var(--c-reg);
        fill: none;
        stroke-width: 1.4;
        stroke-dasharray: 8 4;
      }
      .l-proj {
        stroke: var(--c-proj);
        fill: none;
        stroke-width: 2;
        stroke-dasharray: 5 4;
      }
      .l-band {
        fill: var(--c-proj);
        opacity: 0.14;
      }
      .l-hiccup {
        fill: var(--up-soft);
      }
      .endlabel {
        font-family: var(--f-num);
        font-size: 0.875rem;
        font-weight: 600;
      }
      .end-proj {
        fill: var(--c-proj);
      }
      .cursor-line {
        stroke: var(--fg);
        stroke-width: 1;
        opacity: 0.5;
      }
      .cursor-dot {
        fill: var(--c-weight);
        stroke: var(--panel);
        stroke-width: 2.5;
      }
      .cursor-dot.proj {
        fill: var(--c-proj);
      }
      .finger {
        position: absolute;
        width: 46px;
        height: 64px;
        border-radius: 23px 23px 20px 20px;
        background: rgb(214 168 140 / 0.55);
        border: 2px solid rgb(150 100 70 / 0.7);
        pointer-events: none;
        transform: translate(-50%, -12px);
      }
      .finger::after {
        content: 'finger';
        position: absolute;
        left: 50%;
        bottom: -18px;
        transform: translateX(-50%);
        font-size: 11px;
        color: var(--muted);
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        margin-top: 8px;
        font-size: 0.8125rem;
        color: var(--muted);
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .sw {
        width: 16px;
        height: 0;
        border-top: 3px solid;
        display: inline-block;
        flex: none;
      }
      .sw.dash {
        border-top-style: dashed;
      }
      .sw.dot {
        width: 8px;
        height: 8px;
        border: 0;
        border-radius: 50%;
      }
      .segmented {
        display: flex;
        margin-top: 10px;
        border: 1px solid var(--ref);
        border-radius: 10px;
        padding: 2px;
        gap: 2px;
        background: var(--bg);
      }
      .segmented button {
        flex: 1 1 0;
        min-width: 0;
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--fg);
        font-size: 0.9375rem;
        cursor: pointer;
        padding: 4px 2px;
        overflow-wrap: anywhere;
      }
      .segmented button[aria-pressed='true'] {
        background: var(--panel);
        font-weight: 600;
        box-shadow:
          0 0 0 1px var(--ref),
          0 1px 3px rgb(0 0 0 / 0.12);
      }
      .foot {
        margin: 10px 0 0;
        font-size: 0.875rem;
        color: var(--muted);
      }
      .foot b {
        color: var(--fg);
        font-weight: 600;
      }

      /* ---------- Goal, tables ---------- */
      .bar {
        height: 10px;
        border-radius: 5px;
        background: var(--soft);
        overflow: hidden;
        margin-top: 10px;
        border: 1px solid var(--line);
      }
      .bar > span {
        display: block;
        height: 100%;
        background: var(--accent);
        border-radius: 5px;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
        font-size: 0.9375rem;
      }
      .table th,
      .table td {
        text-align: left;
        padding: 9px 6px;
        border-bottom: 1px solid var(--line);
        overflow-wrap: anywhere;
      }
      /* At large text sizes the columns share the width and their text wraps, rather than the page scrolling sideways. */
      @media (max-width: 959px) {
        .table {
          table-layout: fixed;
        }
      }
      .table thead th {
        font-size: 0.8125rem;
        color: var(--muted);
        font-weight: 600;
      }
      .table .n {
        text-align: right;
        font-family: var(--f-num);
        font-size: 1rem;
        font-variant-numeric: tabular-nums;
      }
      .more-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 4px;
        font-size: 0.875rem;
        color: var(--muted);
      }

      /* ---------- Analysis: cards closed to one line ---------- */
      .acard {
        padding: 0;
      }
      /* The button is named by the title only; the summary describes it; its ::after makes the whole head the target. */
      .acard-head {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 28px;
        gap: 2px 8px;
        align-items: center;
        padding: 14px 14px 14px 16px;
        min-height: 64px;
        border-radius: var(--r);
      }
      .acard-head:has(:focus-visible) {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .acard-head h2 {
        margin: 0;
        grid-column: 1;
      }
      .acard-toggle {
        padding: 0;
        background: none;
        border: 0;
        text-align: left;
        cursor: pointer;
        font-family: var(--f-num);
        font-weight: 500;
        font-size: 1.375rem;
        line-height: 1.15;
      }
      .acard-toggle:focus-visible {
        outline: none;
      }
      .acard-toggle::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: var(--r);
      }
      .acard-sum {
        grid-column: 1;
        margin: 0;
        font-size: 0.9375rem;
        line-height: 1.35;
      }
      .acard-sum b {
        font-weight: 600;
      }
      .chev {
        grid-column: 2;
        grid-row: 1 / span 2;
        width: 28px;
        height: 28px;
        fill: none;
        stroke: var(--muted);
        stroke-width: 2;
        transition: transform 150ms ease-out;
      }
      .acard-head:has([aria-expanded='true']) .chev {
        transform: rotate(180deg);
      }
      .acard-body {
        padding: 0 16px 16px;
        border-top: 1px solid var(--line);
      }
      .acard-body > :first-child {
        margin-top: 12px;
      }
      .acard-tools {
        display: flex;
        justify-content: flex-end;
        margin-top: 10px;
      }
      .mini-kpis {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 12px;
      }
      /* Every figure grid in a card, and Progress's six figures, follow their own width: one column
         below 15 rem (two columns of 7.5 rem at least; Today's three need 20 rem). */
      .acard-body,
      #view-progress {
        container-type: inline-size;
      }
      @container (max-width: 15rem) {
        .mini-kpis,
        .kpis-6 {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .mini-kpis .kpi {
        background: var(--bg);
      }
      .bars {
        display: flex;
        align-items: flex-end;
        gap: 4px;
        height: 120px;
        margin-top: 12px;
      }
      .bars div {
        flex: 1;
        /* The bars share the box; a label never widens its bar. */
        min-width: 0;
        overflow-wrap: anywhere;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        height: 100%;
        gap: 4px;
        font-size: min(0.75rem, 13px);
        color: var(--muted);
      }
      .bars i {
        display: block;
        width: 100%;
        border-radius: 3px 3px 0 0;
        background: var(--c-weight);
      }
      .bars i.up {
        background: var(--up);
      }
      .cal {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 3px;
        margin-top: 6px;
      }
      .cal span {
        aspect-ratio: 1;
        border-radius: 3px;
        background: var(--soft);
      }
      .cal .d1 {
        background: var(--cal-d1);
      }
      .cal .d2 {
        background: var(--cal-d2);
      }
      .cal .d3 {
        background: var(--cal-d3);
      }
      .cal .u1 {
        background: var(--cal-u1);
      }
      .cal .u2 {
        background: var(--cal-u2);
      }
      .cal .u3 {
        background: var(--cal-u3);
      }
      .cal-month {
        margin: 12px 0 0;
        font-size: 0.875rem;
        font-weight: 600;
      }
      .cal-wrap {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 4px 16px;
      }
      .facts {
        margin: 12px 0 0;
        display: grid;
      }
      .facts div {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
      }
      .facts dt {
        color: var(--muted);
      }
      .facts dd {
        margin: 0;
        font-weight: 600;
        text-align: right;
      }
      .bmi-scale {
        display: grid;
        grid-template-columns: 18.5fr 6.5fr 5fr 10fr;
        height: 12px;
        border-radius: 6px;
        overflow: hidden;
        margin-top: 12px;
      }
      .bmi-scale span:nth-child(1) {
        background: var(--cal-d1);
      }
      .bmi-scale span:nth-child(2) {
        background: var(--soft);
      }
      .bmi-scale span:nth-child(3) {
        background: var(--cal-u1);
      }
      .bmi-scale span:nth-child(4) {
        background: var(--cal-u3);
      }

      /* ---------- Your data ---------- */
      .group {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r);
        overflow: hidden;
      }
      .group-title {
        margin: 8px 4px -4px;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 52px;
        padding: 8px 14px 8px 16px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: none;
        width: 100%;
        text-align: left;
        color: var(--fg);
        text-decoration: none;
        cursor: pointer;
        font-size: 1rem;
      }
      .group > :last-child {
        border-bottom: 0;
      }
      .row .grow {
        flex: 1;
        min-width: 0;
      }
      .row .sub {
        display: block;
        font-size: 0.8125rem;
        color: var(--muted);
      }
      .row .val {
        color: var(--muted);
      }
      .row .val.n {
        font-family: var(--f-num);
        font-size: 1.125rem;
        color: var(--fg);
        white-space: nowrap;
      }
      .row svg.go {
        width: 18px;
        height: 18px;
        flex: none;
        fill: none;
        stroke: var(--muted);
        stroke-width: 2;
      }
      .row-log {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto 18px;
      }
      .row-log .chg {
        font-size: 0.875rem;
        min-width: 3.6em;
        text-align: right;
      }
      .row-select {
        position: relative;
      }
      .row-select .sub {
        font-size: 0.9375rem;
      }
      /* The native select covers the row, invisible: a tap opens the system's picker; the value shows as text. */
      .row-select select {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        font-size: 16px;
        cursor: pointer;
      }
      .row-select:has(:focus-visible) {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .row-plain {
        cursor: default;
      }
      .group-pad {
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        border-bottom: 1px solid var(--line);
      }
      .group-pad p {
        margin: 0;
      }
      .group-pad a {
        display: inline-block;
        padding-block: 4px;
      }
      .group-pad h3 {
        margin: 0;
        font-family: var(--f-num);
        font-weight: 500;
        font-size: 1.25rem;
      }
      .group-pad select,
      .group-pad input[type='time'] {
        font: inherit;
        font-size: max(1rem, 16px);
        min-height: 44px;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--ref);
        border-radius: 8px;
        padding: 4px 8px;
        width: 100%;
      }
      .field-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 0.875rem;
        color: var(--muted);
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .danger-zone {
        margin-top: 20px;
        padding-top: 12px;
      }
      .danger-zone .button {
        width: 100%;
      }
      .badge {
        font-size: 0.75rem;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 10px;
        background: var(--soft);
        color: var(--muted);
        white-space: nowrap;
      }
      .status-line {
        font-size: 0.875rem;
      }
      .status-line.bad {
        color: var(--bad);
      }
      .switch {
        flex: none;
        width: 46px;
        height: 28px;
        border-radius: 14px;
        background: var(--soft);
        border: 1px solid var(--ref);
        position: relative;
      }
      .switch::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--panel);
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.3);
        transition: transform 150ms ease-out;
      }
      [aria-pressed='true'] > .switch,
      [aria-checked='true'] > .switch {
        background: var(--accent);
        border-color: var(--accent);
      }
      [aria-pressed='true'] > .switch::after,
      [aria-checked='true'] > .switch::after {
        transform: translateX(18px);
      }
      .switch-row {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        width: 100%;
        padding: 0;
        border: 0;
        background: none;
        text-align: left;
        cursor: pointer;
        font-size: 1rem;
        color: var(--fg);
      }
      .switch-row .grow {
        flex: 1;
      }
      .sections-inline {
        display: none;
      }
      .toast {
        position: fixed;
        z-index: 35;
        left: 16px;
        right: 16px;
        bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 12px);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 8px 8px 16px;
        border-radius: 12px;
        background: var(--fg);
        color: var(--bg);
        box-shadow: var(--shadow);
      }
      .toast p {
        margin: 0;
        flex: 1;
      }
      .toast .button-text {
        color: var(--bg);
        text-decoration: underline;
      }

      /* ---------- The settings sheet: a modal <dialog> at the bottom, on a phone only ---------- */
      .sheet {
        border: 0;
        padding: 0;
        color: var(--fg);
        background: var(--sheet);
      }
      .sheet:modal {
        position: fixed;
        inset: auto 0 0 0;
        margin: 0;
        width: 100%;
        max-width: 640px;
        margin-inline: auto;
        max-height: calc(100svh - env(safe-area-inset-top, 0px) - var(--ad-h) - 32px);
        border-radius: 16px 16px 0 0;
        box-shadow: var(--shadow);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        overflow: auto;
        overscroll-behavior: contain;
        animation: rise 200ms ease-out;
      }
      .sheet::backdrop {
        background: var(--scrim);
      }
      @keyframes rise {
        from {
          transform: translateY(24px);
          opacity: 0.6;
        }
      }
      .sheet-head {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
        padding: 18px 16px 8px;
        background: var(--sheet);
      }
      /* At large text the title and Done wrap rather than squeeze each other. */
      .sheet-head .button {
        flex: none;
      }
      .sheet-head h2 {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .sheet-head::before {
        content: '';
        position: absolute;
        top: 6px;
        left: 50%;
        width: 40px;
        height: 5px;
        margin-left: -20px;
        border-radius: 3px;
        background: var(--axis);
      }
      .sheet-head h2 {
        margin: 0;
        font-family: var(--f-num);
        font-weight: 500;
        font-size: 1.375rem;
      }
      .sheet-head h2:focus {
        outline: none;
      }
      .sheet-body {
        padding: 0 16px 20px;
      }
      .sheet-section {
        margin-top: 16px;
      }
      .sheet-section > h3 {
        margin: 0 0 6px;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .toggle-list {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--line);
        border-radius: var(--r);
        overflow: hidden;
        background: var(--panel);
      }
      .toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 48px;
        padding: 6px 12px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: none;
        text-align: left;
        cursor: pointer;
        font-size: 1rem;
        color: var(--fg);
      }
      .toggle:last-child {
        border-bottom: 0;
      }
      .toggle .grow {
        flex: 1;
        min-width: 0;
      }
      .preset-note {
        margin: 6px 2px 0;
        font-size: 0.875rem;
        color: var(--muted);
      }
      .check-row {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        min-height: 44px;
        padding: 8px 0;
      }
      .check-row input {
        width: 22px;
        height: 22px;
        margin: 2px 0 0;
        flex: none;
      }

      /* On a wide screen the same content sits in a plain panel inside its card, not in a dialog. */
      .options-inline {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.2fr) minmax(0, 1fr);
        gap: 0 24px;
        align-items: start;
      }
      /* The wrapper steps aside so the sections are the panel's grid items. */
      .options-inline > .options-content {
        display: contents;
      }
      .options-inline .sec-view {
        grid-column: 1;
        grid-row: 1;
      }
      .options-inline .sec-method {
        grid-column: 2;
        grid-row: 1;
      }
      .options-inline .sec-horizon {
        grid-column: 3;
        grid-row: 1;
      }
      .options-inline .sec-layers {
        grid-column: 1 / -1;
        grid-row: 2;
      }
      .options-inline .toggle-list,
      .sections-inline .toggle-list {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 6px;
        border: 0;
        background: none;
        overflow: visible;
      }
      .options-inline .toggle,
      .sections-inline .toggle {
        min-height: 36px;
        border: 1px solid var(--ref);
        border-radius: 18px;
        padding: 4px 12px;
        font-size: 0.875rem;
      }
      .options-inline .toggle[aria-pressed='true'],
      .sections-inline .toggle[aria-pressed='true'] {
        background: var(--soft);
        border-color: var(--fg);
        font-weight: 600;
      }
      .options-inline .toggle .switch,
      .sections-inline .toggle .switch {
        display: none;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
        .undo-bar {
          display: none;
        }
      }

      /* ---------- The desktop: one page, the four parts in order, nothing hidden ---------- */
      @media (min-width: 960px) {
        html {
          scroll-padding-top: 72px;
          scroll-padding-bottom: 12px;
        }
        :root.has-tabs main {
          padding-bottom: 48px;
        }
        .appbar,
        main,
        .site-footer {
          max-width: 1240px;
          margin-inline: auto;
          padding-left: 24px;
          padding-right: 24px;
        }
        .appbar {
          position: sticky;
          top: 0;
          z-index: 30;
          background: var(--bg);
          border-bottom: 1px solid var(--line);
          padding-top: 8px;
          padding-bottom: 8px;
          max-width: none;
          padding-left: max(24px, calc((100vw - 1240px) / 2 + 24px));
          padding-right: max(24px, calc((100vw - 1240px) / 2 + 24px));
        }
        .tabs {
          position: static;
          display: flex;
          gap: 4px;
          margin-left: auto;
          background: none;
          border: 0;
          padding: 0;
        }
        .tabs a {
          flex-direction: row;
          min-height: 40px;
          padding: 0 14px;
          border-radius: 20px;
          font-size: 0.9375rem;
          gap: 8px;
        }
        .tabs a svg {
          width: 20px;
          height: 20px;
        }
        .tabs a[aria-current] {
          background: var(--panel);
          box-shadow: 0 0 0 1px var(--line);
        }
        .tabs a[aria-current]::before {
          display: none;
        }
        .tabs .dot {
          top: 6px;
          left: auto;
          right: 6px;
        }
        main {
          padding-top: 20px;
          display: flex;
          flex-direction: column;
          gap: 32px;
        }
        .view,
        .view:not(.current) {
          display: grid;
          grid-template-columns: repeat(12, minmax(0, 1fr));
          gap: 16px;
        }
        .view > * {
          grid-column: 1 / -1;
        }
        .view-title {
          font-size: 1.5rem;
          border-bottom: 1px solid var(--line);
          padding-bottom: 6px;
        }
        .phone-only {
          display: none !important;
        }
        .site-footer {
          display: block;
          padding-top: 16px;
          padding-bottom: 24px;
          border-top: 1px solid var(--line);
          font-size: 0.8125rem;
          color: var(--muted);
        }
        #view-today {
          min-height: 0;
        }
        #view-today .hello {
          grid-column: 1 / span 7;
          grid-row: 1;
        }
        #view-today .entry {
          grid-column: 8 / -1;
          grid-row: 1;
          align-self: start;
        }
        #view-today .kpis-wrap {
          grid-row: 2;
        }
        #view-today .reminder {
          grid-column: 1 / -1;
          grid-row: 3;
        }
        .kpis-desk-row {
          grid-template-columns: repeat(6, minmax(0, 1fr)) !important;
        }
        #view-progress .goal-card {
          grid-column: 1 / span 5;
        }
        #view-progress .weeks-card {
          grid-column: 6 / -1;
        }
        #view-analysis .acard.half {
          grid-column: span 6;
        }
        #view-data .log-group-wrap {
          grid-column: 1 / span 7;
          grid-row: span 4;
        }
        #view-data .side {
          grid-column: 8 / -1;
        }
        .sections-inline {
          display: block;
          padding: 10px 16px 14px;
          border-bottom: 1px solid var(--line);
        }
        .sections-row {
          display: none;
        }
      }
      /* A wide touch screen (an iPad, later) keeps 44 px targets. */
      @media (min-width: 960px) and (pointer: coarse) {
        .tabs a,
        .options-inline .toggle,
        .sections-inline .toggle {
          min-height: 44px;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main" id="skip">Skip to content</a>
    <div class="ad-space" aria-hidden="true">
      <div class="ad-slot">Ad · iPhone app only · native banner, 320 × 50</div>
    </div>

    <header class="appbar">
      <a class="brand" href="#today"
        ><svg viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="7" fill="#2f6690" />
          <path
            d="M6 11 L13 17 L18 14 L26 22"
            fill="none"
            stroke="#fff"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          /></svg
        >Weigh to Go</a
      >
      <nav class="tabs" id="tabs"></nav>
    </header>

    <main id="main" tabindex="-1">
      <section class="view" id="view-today" aria-labelledby="today-title"></section>
      <section class="view" id="view-progress" aria-labelledby="progress-title"></section>
      <section class="view" id="view-analysis" aria-labelledby="analysis-title"></section>
      <section class="view" id="view-data" aria-labelledby="data-title"></section>
    </main>
    <footer class="site-footer" id="footer"></footer>

    <dialog class="sheet" id="sheet" aria-labelledby="sheet-title"></dialog>
    <div class="toast" id="toast" role="status" hidden></div>

    <script>
      'use strict';
      const Q = new URLSearchParams(location.search);
      const root = document.documentElement;
      if (
        Q.get('theme') === 'dark' ||
        (!Q.get('theme') && matchMedia('(prefers-color-scheme: dark)').matches)
      )
        root.classList.add('dark');
      const APP = Q.get('app') === '1' || Q.get('ad') === '1';
      const EMPTY = Q.get('empty') === '1';
      if (APP) root.classList.add('app');
      // No banner while the diary is empty (design §8): the band collapses to the status bar.
      if (Q.get('ad') === '1' && !EMPTY) root.classList.add('ad');
      // Text size. In the app the root follows Dynamic Type (17 px at the default size), capped at 34 px (200% of the app's 17 px).
      const DT = Number(Q.get('dt')) || (APP ? 17 : 16);
      const scale = Q.get('text') === '200' ? 2 : Q.get('text') === '150' ? 1.5 : 1;
      root.style.fontSize = `${Math.min(DT * scale, 34)}px`;
      const LANG = Q.get('lang') === 'pt' ? 'pt' : 'en';
      const LOCALE = LANG === 'pt' ? 'pt-BR' : 'en-GB';
      root.lang = LANG === 'pt' ? 'pt-BR' : 'en';
      const UNIT = Q.get('unit') === 'lb' ? 'lb' : 'kg';
      const desk = matchMedia('(min-width: 960px)');
      /** English or Portuguese (the product reads every string from src/i18n/messages.ts). */
      const L = (en, pt) => (LANG === 'pt' ? pt : en);
      history.scrollRestoration = 'manual';

      // ---------- A made-up year (no personal data) ----------
      const DAY = 86400000;
      const TODAY = Date.UTC(2026, 9, 21);
      function seeded(seed) {
        return () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      }
      const rnd = seeded(11);
      let days = [];
      for (let i = 0; i < 365; i++) {
        const t = TODAY - (365 - i) * DAY;
        const base = 104 - (7.6 * i) / 364 + 0.45 * Math.sin(i / 19) + 0.25 * Math.sin(i / 5.3);
        const kg = Math.round((base + (rnd() - 0.5) * 1.0) * 10) / 10;
        if (rnd() < 0.085 && i < 364) continue;
        days.push({ t, kg });
      }
      if (EMPTY) days = [];
      const SAVED = Q.get('saved') === '1',
        LOGGED = Q.get('logged') === '1';
      if ((SAVED || LOGGED) && days.length)
        days.push({ t: TODAY, kg: Math.round((days[days.length - 1].kg - 0.4) * 10) / 10 });
      for (let i = 0; i < days.length; i++) {
        let s = 0,
          n = 0;
        for (let j = i; j >= 0 && days[j].t > days[i].t - 7 * DAY; j--) {
          s += days[j].kg;
          n++;
        }
        days[i].avg7 = s / n;
      }
      const GOAL = 92,
        HEIGHT = 1.76;
      function fit(list) {
        const n = list.length;
        if (n < 2) return null;
        const x0 = list[0].t;
        let sx = 0,
          sy = 0,
          sxx = 0,
          sxy = 0;
        for (const d of list) {
          const x = (d.t - x0) / DAY;
          sx += x;
          sy += d.kg;
          sxx += x * x;
          sxy += x * d.kg;
        }
        const b = (n * sxy - sx * sy) / (n * sxx - sx * sx);
        const a = (sy - b * sx) / n;
        return { a, b, x0, at: (t) => a + b * ((t - x0) / DAY) };
      }
      const lin = fit(days);
      const recent = fit(days.filter((d) => d.t > (days.at(-1)?.t ?? 0) - 21 * DAY));
      const first = days[0],
        last = days.at(-1);
      const todayLogged = last?.t === TODAY;
      const before = todayLogged ? days.at(-2) : last;

      // ---------- Formatting ----------
      const conv = (kg) => (UNIT === 'lb' ? kg * 2.20462 : kg);
      const nf = (d) => new Intl.NumberFormat(LOCALE, { minimumFractionDigits: d, maximumFractionDigits: d });
      const num = (kg, d = 1) => nf(d).format(conv(kg));
      const wt = (kg, d = 1) => `${num(kg, d)} ${UNIT}`;
      const signed = (kg, d = 1) => {
        const v = conv(kg);
        const s = nf(d).format(Math.abs(v));
        return (v < -0.04 ? '−' : v > 0.04 ? '+' : '±') + s;
      };
      const dirClass = (kg) => (kg < -0.04 ? 'down' : kg > 0.04 ? 'up' : '');
      const pct = (v, d = 1) =>
        new Intl.NumberFormat(LOCALE, {
          style: 'percent',
          minimumFractionDigits: d,
          maximumFractionDigits: d,
        }).format(v);
      const dfmt = (t, o) => new Intl.DateTimeFormat(LOCALE, { timeZone: 'UTC', ...o }).format(new Date(t));
      const dShort = (t) => dfmt(t, { day: 'numeric', month: 'short' });
      const dLong = (t) => dfmt(t, { weekday: 'long', day: 'numeric', month: 'long' });
      const dYear = (t) => dfmt(t, { day: 'numeric', month: 'short', year: 'numeric' });
      /** The readout's day: short, with the year only when it isn't this year. */
      const dRead = (t) =>
        dfmt(t, {
          weekday: 'short',
          day: 'numeric',
          month: 'short',
          ...(new Date(t).getUTCFullYear() !== 2026 ? { year: 'numeric' } : {}),
        });
      /** A sentence never gets two full stops after an abbreviated month ("26 de set.."). */
      const sentence = (s) => s.replace(/\.\.(?=<|$)/g, '.');
      const plural = (n, en, pt) => `${n} ${L(en, pt)}${n === 1 ? '' : 's'}`;

      const ICON = {
        today:
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M6 20V9.5a6 6 0 0 1 12 0V20"/><path d="M12 12l2.5-3"/></svg>',
        progress:
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5l6 6 4-3 8 9"/><path d="M3 20h18"/></svg>',
        analysis:
          '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>',
        data: '<svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6M4.5 12v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/></svg>',
        cal: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
        sliders:
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
        chev: '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
        go: '<svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
        check:
          '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>',
      };

      // ---------- The shell: tab links, routes, focus, the bar's measured height ----------
      const ROUTES = {
        today: 'view-today',
        progress: 'view-progress',
        analysis: 'view-analysis',
        data: 'view-data',
      };
      const NAMES = {
        today: L('Today', 'Hoje'),
        progress: L('Progress', 'Progresso'),
        analysis: L('Analysis', 'Análise'),
        data: L('Your data', 'Seus dados'),
      };
      const backupDue = !EMPTY;
      const tabs = document.getElementById('tabs');
      tabs.setAttribute('aria-label', L('Diary', 'Diário'));
      tabs.innerHTML = Object.keys(ROUTES)
        .map(
          (k) =>
            `<a href="#${k}" data-tab="${k}">${ICON[k]}<span>${NAMES[k]}</span>${k === 'data' && backupDue ? `<span class="dot" aria-hidden="true"></span><span class="visually-hidden"> ${L('(backup due)', '(backup pendente)')}</span>` : ''}</a>`,
        )
        .join('');
      root.classList.add('has-tabs');
      // The bar grows with text size and wrapping: the page's room for it follows what it measures.
      // Hidden while typing, it measures 0: the last real height is kept.
      new ResizeObserver(() => {
        if (!desk.matches && tabs.offsetHeight > 0)
          root.style.setProperty('--tab-h', `${tabs.offsetHeight}px`);
      }).observe(tabs);
      document.getElementById('skip').textContent = L('Skip to content', 'Pular para o conteúdo');
      const scrolls = {};
      let current = null;
      function markCurrent(tab) {
        for (const a of tabs.querySelectorAll('a')) {
          if (a.dataset.tab === tab) a.setAttribute('aria-current', desk.matches ? 'location' : 'page');
          else a.removeAttribute('aria-current');
        }
      }
      function show(tab, focus) {
        if (!ROUTES[tab]) tab = 'today';
        if (current && !desk.matches) scrolls[current] = scrollY;
        current = tab;
        for (const [k, id] of Object.entries(ROUTES))
          document.getElementById(id).classList.toggle('current', k === tab);
        markCurrent(tab);
        document.title = `${tab === 'today' ? '' : NAMES[tab] + ' · '}Weigh to Go`;
        if (desk.matches) {
          if (focus) document.getElementById(ROUTES[tab]).scrollIntoView({ block: 'start' });
        } else {
          scrollTo(0, scrolls[tab] || 0);
          if (focus) document.getElementById(`${tab}-title`).focus({ preventScroll: true });
        }
        redrawShown();
      }
      // Only the four routes switch views; any other hash (the skip link's #main) is left to the browser.
      addEventListener('hashchange', () => {
        const h = location.hash.slice(1);
        if (ROUTES[h]) show(h, true);
      });
      // While a text field has focus the keypad is up: the tab bar and the banner step aside.
      // Text, number and search inputs and textareas; not range, date, time or checkbox.
      const TYPING = 'input[type=text], input[type=number], input[type=search], input:not([type]), textarea';
      document.addEventListener('focusin', (e) => {
        if (e.target.matches(TYPING)) root.classList.add('typing');
      });
      document.addEventListener('focusout', () => root.classList.remove('typing'));

      // ---------- Today ----------
      function kpiTile(label, value, unit, sub, cls = '') {
        return `<div class="kpi"><span class="kpi-label">${label}</span><span class="kpi-value ${cls}">${value}${unit ? `<span class="kpi-unit">${unit}</span>` : ''}</span><span class="kpi-sub">${sub}</span></div>`;
      }
      function avgWeekBefore() {
        const t = last.t - 7 * DAY;
        let best = days[0];
        for (const d of days) if (d.t <= t) best = d;
        return best.avg7;
      }
      const perWeek = () => `${UNIT}${L('/wk', '/sem')}`;
      // The built key figures (kpi.*), word for word.
      function kpiAvg7() {
        const ch = last.avg7 - avgWeekBefore();
        return kpiTile(
          L('7-day average', 'Média dos últimos 7 dias'),
          num(last.avg7),
          UNIT,
          `<span class="${dirClass(ch)}">${signed(ch)} ${UNIT}</span> ${L('vs. 7 days before', 'vs. 7 dias antes')}`,
        );
      }
      function kpiLoss() {
        return kpiTile(
          L('Total loss', 'Perda total'),
          num(first.kg - last.kg),
          UNIT,
          L(
            `${pct((first.kg - last.kg) / first.kg)} of the starting ${wt(first.kg)}`,
            `${pct((first.kg - last.kg) / first.kg)} dos ${wt(first.kg)} iniciais`,
          ),
          'down',
        );
      }
      function kpiPace() {
        return kpiTile(
          L('Average pace', 'Ritmo médio'),
          signed(lin.b * 7, 2),
          perWeek(),
          `${L('Last 3 weeks:', 'Últimas 3 semanas:')} <span class="${dirClass(recent.b)}">${signed(recent.b * 7, 2)} ${perWeek()}</span>`,
          dirClass(lin.b),
        );
      }
      function threeKpis() {
        return [kpiAvg7(), kpiLoss(), kpiPace()];
      }
      function sixKpis() {
        let min = days[0],
          max = days[0];
        for (const d of days) {
          if (d.kg < min.kg) min = d;
          if (d.kg > max.kg) max = d;
        }
        const prev = days.at(-2),
          since = Math.round((last.t - min.t) / DAY);
        return [
          kpiTile(
            L('Current weight', 'Peso atual'),
            num(last.kg),
            UNIT,
            `${L('on', 'em')} ${dShort(last.t)} · <span class="${dirClass(last.kg - prev.kg)}">${signed(last.kg - prev.kg)} ${UNIT}</span> ${L('vs. previous', 'vs. anterior')}`,
          ),
          kpiLoss(),
          kpiPace(),
          kpiAvg7(),
          kpiTile(
            L('Lowest', 'Mínima'),
            num(min.kg),
            UNIT,
            `${L('on', 'em')} ${dShort(min.t)} · ${since === 0 ? L('today', 'hoje') : L(`${plural(since, 'day', 'dia')} ago`, `há ${plural(since, 'day', 'dia')}`)}`,
          ),
          kpiTile(L('Highest', 'Máxima'), num(max.kg), UNIT, `${L('on', 'em')} ${dShort(max.t)}`),
        ];
      }
      function drawSpark() {
        const box = document.getElementById('spark-plot');
        if (!box || !box.clientWidth) return;
        const w = box.clientWidth,
          h = box.clientHeight;
        const list = days.filter((d) => d.t > last.t - 30 * DAY);
        const lo = Math.min(...list.map((d) => d.kg)) - 0.2,
          hi = Math.max(...list.map((d) => d.kg)) + 0.2;
        const x = (t) => 4 + ((t - (last.t - 29 * DAY)) / (29 * DAY)) * (w - 8);
        const y = (v) => 4 + (1 - (v - lo) / (hi - lo)) * (h - 8);
        box.innerHTML = `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true">${list.map((d) => `<circle cx="${x(d.t).toFixed(1)}" cy="${y(d.kg).toFixed(1)}" r="2.2" class="l-points"/>`).join('')}<path d="${list.map((d, i) => `${i ? 'L' : 'M'}${x(d.t).toFixed(1)},${y(d.avg7).toFixed(1)}`).join('')}" class="l-avg7"/></svg>`;
      }
      const STR = {
        // New strings of the design (proposed keys).
        last: (w) => L(`Last: ${w}, yesterday`, `Última: ${w}, ontem`),
        logged: (w) => L(`Today: ${w}. Saving replaces it.`, `Hoje: ${w}. Salvar substitui o valor.`),
        savedSub: (c) =>
          L(
