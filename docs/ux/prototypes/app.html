            chartState[id] = id === 'horizon' ? Number(b.dataset.v) : b.dataset.v;
            for (const x of b.parentElement.children) x.setAttribute('aria-pressed', String(x === b));
            drawMain();
          });
      }
      function presetNote() {
        return chartState.preset === 'essential'
          ? L(
              'Weigh-ins, the 7-day average, the projection and the goal.',
              'Pesagens, média de 7 dias, projeção e meta.',
            )
          : chartState.preset === 'detailed'
            ? L(
                'Adds the daily line, the projection range, highest and lowest, and hiccups.',
                'Acrescenta a linha diária, a faixa da projeção, máxima e mínima, e os soluços.',
              )
            : L(
                'Your own choice of layers, kept on this device.',
                'Sua escolha de camadas, guardada neste aparelho.',
              );
      }
      function weeksRows(k) {
        let out = '';
        for (let i = 0; i < k; i++) {
          const end = last.t - i * 7 * DAY,
            list = days.filter((d) => d.t <= end && d.t > end - 7 * DAY),
            prevL = days.filter((d) => d.t <= end - 7 * DAY && d.t > end - 14 * DAY);
          const m = list.reduce((s, d) => s + d.kg, 0) / list.length,
            p = prevL.reduce((s, d) => s + d.kg, 0) / prevL.length;
          out += `<tr><td>${dShort(end - 6 * DAY)}–${dShort(end)}</td><td class="n">${num(m)}</td><td class="n ${dirClass(m - p)}">${signed(m - p)}</td></tr>`;
        }
        return out;
      }

      // The main chart: drawn at the card's width, text in rem, a readout of fixed height above the plot.
      function remPx() {
        return parseFloat(getComputedStyle(root).fontSize);
      }
      function drawMain() {
        const box = document.getElementById('chart-box');
        if (!box || days.length < 2) return;
        const W0 = box.clientWidth;
        if (!W0) return;
        const rem = remPx();
        const Ls = chartState.layers;
        const start = chartState.period === 'all' ? first.t : last.t - (chartState.period - 1) * DAY;
        const list = days.filter((d) => d.t >= start);
        const hz = Ls.has('projection') ? chartState.horizon : 0;
        const end = last.t + hz * DAY;
        const model = chartState.method === 'recent' ? recent : lin;
        const projAt = (t) => last.avg7 + model.b * ((t - last.t) / DAY);
        const spread = (h) => 0.15 + h * 0.022;
        const stops = list.map((d) => ({ t: d.t, kg: d.kg, avg7: d.avg7 }));
        if (hz) stops.push({ t: end, proj: projAt(end) });
        const readoutHtml = (st) =>
          st.proj
            ? `<span class="r-day">${dRead(st.t)} · ${L('estimate', 'estimativa')}</span><span class="r-item"><i style="background:var(--c-proj)"></i>${wt(st.proj)}</span><span class="r-item">${num(st.proj - spread(hz))}–${num(st.proj + spread(hz))}</span>`
            : `<span class="r-day">${dRead(st.t)}${st.t === last.t ? ' · ' + L('last weigh-in', 'último registro') : ''}</span><span class="r-item"><i style="background:var(--c-weight)"></i>${wt(st.kg)}</span>${Ls.has('avg7') ? `<span class="r-item"><i style="background:var(--c-avg7)"></i>${L('7-day', '7 dias')} ${wt(st.avg7)}</span>` : ''}`;
        const ro = document.getElementById('readout');
        // Fixed height: measured on every draw from the longest stops (plot.ts: CursorSpec.longest()), so nothing moves while scrubbing.
        ro.style.minHeight = '0px';
        let tallest = 0;
        for (const st of [
          stops[0],
          stops[list.length - 1],
          ...(hz ? [stops.at(-1)] : []),
          { t: Date.UTC(2025, 8, 30), kg: 104.4, avg7: 104.4 },
        ]) {
          ro.innerHTML = readoutHtml(st);
          tallest = Math.max(tallest, Math.ceil(ro.getBoundingClientRect().height));
        }
        ro.style.minHeight = `${tallest}px`;
        // The plot's height: 15.5 rem on a phone, but never more than the small viewport left after the
        // bars, the banner and the readout (at the 200% cap a 496 px plot would not fit a 568 px screen).
        const room =
          innerHeight -
          (tabs.offsetHeight || 56) -
          parseFloat(getComputedStyle(root).getPropertyValue('--ad-h')) -
          tallest -
          rem * 3;
        const H = desk.matches ? Math.round(rem * 22) : Math.round(Math.max(160, Math.min(rem * 15.5, room)));
        let lo = Math.min(...list.map((d) => d.kg)),
          hi = Math.max(...list.map((d) => d.kg));
        if (hz) lo = Math.min(lo, projAt(end) - 0.6);
        if (Ls.has('goal') && GOAL > lo - 6) lo = Math.min(lo, GOAL);
        lo = conv(lo);
        hi = conv(hi);
        const step = hi - lo > 12 ? (UNIT === 'lb' ? 5 : 2) : hi - lo > 4 ? 1 : 0.5;
        lo = Math.floor(lo / step) * step - (Ls.has('goal') ? step * 0.3 : 0);
        hi = Math.ceil(hi / step) * step;
        // A narrow chart gives the end label's margin back to the plot; the estimate is in the foot and the readout.
        const endLabel = hz && W0 >= rem * 17;
        const left = rem * 2.4,
          right = rem * (endLabel ? 3.2 : 0.8),
          top = rem * 0.6,
          bottom = rem * 1.6;
        const x = (t) => left + ((t - start) / Math.max(DAY, end - start)) * (W0 - left - right);
        const y = (kg) => top + (1 - (conv(kg) - lo) / (hi - lo)) * (H - top - bottom);
        const yv = (v) => top + (1 - (v - lo) / (hi - lo)) * (H - top - bottom);
        let s = '';
        if (Ls.has('hiccups'))
          for (const hc of hiccups())
            if (hc.to >= start)
              s += `<rect class="l-hiccup" x="${x(Math.max(hc.from, start))}" y="${top}" width="${Math.max(2, x(hc.to) - x(Math.max(hc.from, start)))}" height="${H - top - bottom}"/>`;
        for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + 1e-9; v += step)
          s += `<line class="gridline" x1="${left}" x2="${W0 - right}" y1="${yv(v)}" y2="${yv(v)}"/><text class="tick" x="${left - 6}" y="${yv(v) + rem * 0.28}" text-anchor="end">${nf(step < 1 ? 1 : 0).format(v)}</text>`;
        const span = end - start;
        const labelW = rem * (span > 70 * DAY ? 2.4 : 3.4);
        const marks = [];
        const sd = new Date(start);
        let m = Date.UTC(sd.getUTCFullYear(), sd.getUTCMonth() + 1, 1);
        if (span > 70 * DAY) {
          while (m <= end) {
            marks.push(m);
            const dd = new Date(m);
            m = Date.UTC(dd.getUTCFullYear(), dd.getUTCMonth() + 1, 1);
          }
        } else {
          let t = start + 7 * DAY - ((start / DAY + 3) % 7) * DAY;
          while (t <= end) {
            marks.push(t);
            t += 7 * DAY;
          }
        }
        const every = Math.max(
          1,
          Math.ceil(marks.length / Math.max(1, Math.floor((W0 - left - right) / (labelW + 8)))),
        );
        marks.forEach((t, i) => {
          if (i % every) return;
          s += `<text class="tick" x="${x(t)}" y="${H - rem * 0.35}" text-anchor="middle">${span > 70 * DAY ? dfmt(t, { month: 'short' }) : dShort(t)}</text>`;
        });
        s += `<line class="axisline" x1="${left}" x2="${W0 - right}" y1="${H - bottom}" y2="${H - bottom}"/>`;
        if (Ls.has('bmi'))
          for (const b of [25, 30, 35]) {
            const kg = b * HEIGHT * HEIGHT;
            if (conv(kg) > lo && conv(kg) < hi)
              s += `<line class="bmi-line" x1="${left}" x2="${W0 - right}" y1="${y(kg)}" y2="${y(kg)}"/><text class="reflabel" x="${left + 4}" y="${y(kg) - 4}">${L('BMI', 'IMC')} ${b}</text>`;
          }
        if (Ls.has('goal'))
          s += `<line class="goal-line" x1="${left}" x2="${W0 - right}" y1="${y(GOAL)}" y2="${y(GOAL)}"/><text class="goal-label" x="${left + 4}" y="${y(GOAL) - 5}">${L('Goal', 'Meta')} ${wt(GOAL)}</text>`;
        if (Ls.has('regression')) {
          const m2 = fit(list);
          s += `<path class="l-reg" d="M${x(list[0].t)},${y(m2.at(list[0].t))}L${x(last.t)},${y(m2.at(last.t))}"/>`;
        }
        if (Ls.has('band') && hz) {
          const hs = [];
          for (let h = 0; h <= hz; h += 3) hs.push(h);
          const up = hs.map((h) => `${x(last.t + h * DAY)},${y(projAt(last.t + h * DAY) + spread(h))}`);
          const dn = [...hs]
            .reverse()
            .map((h) => `${x(last.t + h * DAY)},${y(projAt(last.t + h * DAY) - spread(h))}`);
          s += `<path class="l-band" d="M${up.join('L')}L${dn.join('L')}Z"/>`;
        }
        if (Ls.has('line'))
          s += `<path class="l-line" d="${list.map((d, i) => `${i ? 'L' : 'M'}${x(d.t).toFixed(1)},${y(d.kg).toFixed(1)}`).join('')}"/>`;
        const r = list.length > 120 ? 1.7 : list.length > 40 ? 2.4 : 3.2;
        if (Ls.has('points'))
          s += list
            .map(
              (d) =>
                `<circle class="l-points" cx="${x(d.t).toFixed(1)}" cy="${y(d.kg).toFixed(1)}" r="${r}"/>`,
            )
            .join('');
        if (Ls.has('weekly')) {
          let p = '';
          for (let t = start; t <= last.t; t += 7 * DAY) {
            const w = list.filter((d) => d.t >= t && d.t < t + 7 * DAY);
            if (!w.length) continue;
            const mm = w.reduce((a, d) => a + d.kg, 0) / w.length;
            p += `M${x(t)},${y(mm)}L${x(t + 7 * DAY)},${y(mm)}`;
          }
          s += `<path class="l-weekly" d="${p}"/>`;
        }
        if (Ls.has('trend')) {
          let e = list[0].kg;
          s += `<path class="l-trend" d="${list
            .map((d, i) => {
              e = e + 0.1 * (d.kg - e);
              return `${i ? 'L' : 'M'}${x(d.t).toFixed(1)},${y(e).toFixed(1)}`;
            })
            .join('')}"/>`;
        }
        if (Ls.has('avg7'))
          s += `<path class="l-avg7" d="${list.map((d, i) => `${i ? 'L' : 'M'}${x(d.t).toFixed(1)},${y(d.avg7).toFixed(1)}`).join('')}"/>`;
        if (hz)
          s += `<path class="l-proj" d="M${x(last.t)},${y(last.avg7)}L${x(end)},${y(projAt(end))}"/>${endLabel ? `<text class="endlabel end-proj" x="${x(end) + 4}" y="${y(projAt(end)) + rem * 0.3}">${num(projAt(end))}</text>` : ''}`;
        if (Ls.has('extremes')) {
          let mn = list[0],
            mx = list[0];
          for (const d of list) {
            if (d.kg < mn.kg) mn = d;
            if (d.kg > mx.kg) mx = d;
          }
          s += `<text class="reflabel" x="${Math.min(x(mx.t) + 6, W0 - right - rem * 4)}" y="${y(mx.kg) + rem * 0.35}">${L('high', 'máx.')} ${num(mx.kg)}</text><text class="reflabel" x="${x(mn.t) - 6}" y="${y(mn.kg) + rem * 1.1}" text-anchor="end">${L('low', 'mín.')} ${num(mn.kg)}</text>`;
        }
        s += `<g id="cursor"></g>`;
        box.innerHTML = `<svg id="main-svg" width="${W0}" height="${H}" viewBox="0 0 ${W0} ${H}" tabindex="0"></svg><span class="visually-hidden" aria-live="polite" id="chart-live"></span>`;
        const svg = box.firstElementChild;
        svg.innerHTML = s;
        document.getElementById('legend').innerHTML = LAYERS.filter(
          ([k]) => Ls.has(k) && !['extremes', 'events', 'band', 'weekRange'].includes(k),
        )
          .map(
            ([k, l, st, c]) =>
              `<span><i class="sw ${st === 'dot' ? 'dot' : st}" style="${st === 'dot' ? 'background' : 'border-color'}:var(${c})"></i>${l}</span>`,
          )
          .join('');
        // Built: chart.foot with method.*.name, word for word.
        const mName =
          chartState.method === 'recent'
            ? L('over the last 3 weeks', 'linear das últimas 3 semanas')
            : L('over the whole period', 'linear do período todo');
        document.getElementById('foot').innerHTML = hz
          ? L(
              `Projection ${mName} (${signed(model.b * 7, 2)} ${UNIT} a week): <b>${wt(projAt(end))}</b> on ${dYear(end)}, likely between ${wt(projAt(end) - spread(hz))} and ${wt(projAt(end) + spread(hz))}. It extends the past pace; it is not a promise.`,
              `Projeção ${mName} (${signed(model.b * 7, 2)} ${UNIT} por semana): <b>${wt(projAt(end))}</b> em ${dYear(end)}, provavelmente entre ${wt(projAt(end) - spread(hz))} e ${wt(projAt(end) + spread(hz))}. É uma extrapolação do ritmo passado, não uma promessa.`,
            )
          : '';
        const readout = (st) => {
          ro.innerHTML = readoutHtml(st);
        };
        const showStop = (i) => {
          const st = stops[i];
          chartState.cursor = i;
          const v = st.proj ?? st.kg;
          svg.querySelector('#cursor').innerHTML =
            `<line class="cursor-line" x1="${x(st.t)}" x2="${x(st.t)}" y1="${top}" y2="${H - bottom}"/><circle class="cursor-dot ${st.proj ? 'proj' : ''}" cx="${x(st.t)}" cy="${y(v)}" r="6"/>`;
          readout(st);
        };
        readout(stops[list.length - 1]);
        const nearest = (px) => {
          let best = 0,
            bd = Infinity;
          stops.forEach((st, i) => {
            const dd = Math.abs(x(st.t) - px);
            if (dd < bd) {
              bd = dd;
              best = i;
            }
          });
          return best;
        };
        const onPoint = (e) => {
          const rc = svg.getBoundingClientRect();
          showStop(nearest(e.clientX - rc.left));
        };
        svg.addEventListener('pointerdown', onPoint);
        svg.addEventListener('pointermove', (e) => {
          if (e.pointerType === 'mouse' || e.buttons) onPoint(e);
        });
        svg.addEventListener('keydown', (e) => {
          let i = chartState.cursor ?? list.length - 1;
          if (e.key === 'ArrowLeft') i = Math.max(0, i - 1);
          else if (e.key === 'ArrowRight') i = Math.min(stops.length - 1, i + 1);
          else if (e.key === 'Home') i = 0;
          else if (e.key === 'End') i = stops.length - 1;
          else if (e.key === 'Escape') {
            svg.querySelector('#cursor').innerHTML = '';
            readout(stops[list.length - 1]);
            return;
          } else return;
          e.preventDefault();
          showStop(i);
          document.getElementById('chart-live').textContent = ro.textContent;
        });
        const scrub = Q.get('scrub');
        if (scrub !== null && current === 'progress') {
          const i = nearest(x(last.t - Number(scrub) * DAY));
          showStop(i);
          if (Q.get('finger') === '1') {
            const f = document.createElement('div');
            f.className = 'finger';
            const st = stops[i];
            f.style.left = `${x(st.t)}px`;
            f.style.top = `${y(st.proj ?? st.kg)}px`;
            box.append(f);
          }
        }
      }
      function hiccups() {
        const out = [];
        let run = null;
        for (let i = 1; i < days.length; i++) {
          if (days[i].avg7 > days[i - 1].avg7 + 0.02) {
            if (!run) run = { from: days[i - 1].t, start: days[i - 1].avg7, n: 0 };
            run.n++;
            run.to = days[i].t;
            run.gain = days[i].avg7 - run.start;
          } else {
            if (run && run.n >= 3 && run.gain >= 0.3) out.push(run);
            run = null;
          }
        }
        return out;
      }

      // ---------- Analysis: each card closed to one line ----------
      function cards() {
        const h = hiccups();
        const lossPct = (first.kg - last.kg) / first.kg;
        const goalPct = (first.kg - GOAL) / first.kg;
        const bmi = last.avg7 / (HEIGHT * HEIGHT),
          bmi0 = first.kg / (HEIGHT * HEIGHT);
        const lastH = h.at(-1),
          lastDays = Math.round((lastH.to - lastH.from) / DAY);
        // Titles are the built *.title strings; summaries are new strings of the design.
        return [
          {
            id: 'pct',
            title: L('Percentage loss', 'Perda percentual'),
            sum: L(
              `<b>${pct(lossPct)}</b> lost; ${pct(lossPct / goalPct, 0)} of the way to the ${pct(goalPct)} goal.`,
              `<b>${pct(lossPct)}</b> perdidos; ${pct(lossPct / goalPct, 0)} do caminho até a meta de ${pct(goalPct)}.`,
            ),
            body: pctBody,
          },
          {
            id: 'rate',
            title: L('Compound daily rate', 'Taxa diária composta'),
            sum: L(
              `<b>${pct(-recent.b / last.kg, 2)} a day</b> over the last 3 weeks, about ${wt(Math.abs(recent.b * 7), 2)} a week.`,
              `<b>${pct(-recent.b / last.kg, 2)} ao dia</b> nas últimas 3 semanas, cerca de ${wt(Math.abs(recent.b * 7), 2)} por semana.`,
            ),
            body: rateBody,
          },
          // The date sits mid-sentence: a sentence never ends on an abbreviated month.
          {
            id: 'hiccups',
            title: L('Hiccups', 'Soluços'),
            sum: L(
              `<b>${h.length} climbs</b> back up in a year; the last, ending on ${dShort(lastH.to)}, lasted ${lastDays} days.`,
              `<b>${h.length} subidas</b> em um ano; a última, até ${dShort(lastH.to)}, durou ${lastDays} dias.`,
            ),
            body: hiccupsBody,
          },
          {
            id: 'bmi',
            half: true,
            title: L('BMI', 'IMC'),
            sum: L(
              `<b>${nf(1).format(bmi)}</b> today, ${nf(1).format(bmi0 - bmi)} lower than at the start.`,
              `<b>${nf(1).format(bmi)}</b> hoje, ${nf(1).format(bmi0 - bmi)} abaixo do início.`,
            ),
            body: bmiBody,
          },
          {
            id: 'facts',
            half: true,
            title: L('Facts', 'Curiosidades'),
            sum: L(
              `${days.length} weigh-ins in 365 days; the biggest one-day drop was ${wt(1.3)}.`,
              `${days.length} pesagens em 365 dias; a maior queda num dia foi de ${wt(1.3)}.`,
            ),
            body: factsBody,
          },
          {
            id: 'variation',
            half: true,
            title: L('Day-to-day variation', 'Variação de um dia para o outro'),
            sum: L(
              `A typical day moves <b>±${wt(0.4)}</b>; 8 days in 10 stay within ±${wt(0.7)}.`,
              `Num dia típico o peso muda <b>±${wt(0.4)}</b>; 8 em cada 10 dias ficam dentro de ±${wt(0.7)}.`,
            ),
            body: variationBody,
          },
          {
            id: 'weekdays',
            half: true,
            title: L('Weekdays', 'Dias da semana'),
            sum: L(
              `Mondays read highest and Fridays lowest, ${wt(0.3)} apart.`,
              `As segundas pesam mais e as sextas menos, ${wt(0.3)} de diferença.`,
            ),
            body: weekdaysBody,
          },
          {
            id: 'calendar',
            title: L('Calendar', 'Calendário'),
            sum: L(
              'Last 3 months: 41 days down, 37 up and 12 without a weigh-in.',
              'Últimos 3 meses: 41 dias de queda, 37 de subida e 12 sem pesagem.',
            ),
            body: calendarBody,
          },
        ];
      }
      function renderAnalysis() {
        const el = document.getElementById('view-analysis');
        if (days.length < 2) {
          el.innerHTML = `<h1 class="view-title" id="analysis-title" tabindex="-1">${NAMES.analysis}</h1><div class="card"><p class="take" style="margin:0">${L('The analysis appears from the second weigh-in; some cards need three weeks.', 'As análises aparecem a partir da segunda pesagem; alguns cartões precisam de três semanas.')}</p><p style="margin:12px 0 0"><a class="button" href="#today">${L('Log a weigh-in', 'Registrar pesagem')}</a></p></div>`;
          return;
        }
        const open = new Set((Q.get('open') || '').split(',').filter(Boolean));
        if (desk.matches || Q.get('all') === '1') cards().forEach((c) => open.add(c.id));
        el.innerHTML =
          `<h1 class="view-title" id="analysis-title" tabindex="-1">${NAMES.analysis}</h1><p class="lede phone-only">${L('Each card says its point. Open one for the detail.', 'Cada cartão diz o essencial. Abra um para ver os detalhes.')}</p>` +
          cards()
            .map(
              (c) =>
                `<section class="card acard ${c.half ? 'half' : ''}" id="card-${c.id}" aria-labelledby="btn-${c.id}"><div class="acard-head"><h2><button class="acard-toggle" type="button" id="btn-${c.id}" aria-expanded="${open.has(c.id)}" aria-controls="body-${c.id}" aria-describedby="sum-${c.id}">${c.title}</button></h2><p class="acard-sum" id="sum-${c.id}">${sentence(c.sum)}</p>${ICON.chev}</div><div class="acard-body" id="body-${c.id}" ${open.has(c.id) ? '' : 'hidden'}>${open.has(c.id) ? c.body() : ''}</div></section>`,
            )
            .join('');
        for (const b of el.querySelectorAll('.acard-toggle'))
          b.addEventListener('click', () => {
            const on = b.getAttribute('aria-expanded') !== 'true';
            b.setAttribute('aria-expanded', String(on));
            const body = document.getElementById(b.getAttribute('aria-controls'));
            body.hidden = !on;
            if (on && !body.innerHTML)
              body.innerHTML = cards()
                .find((c) => `body-${c.id}` === body.id)
                .body();
            wireCardTools(body);
          });
        for (const body of el.querySelectorAll('.acard-body:not([hidden])')) wireCardTools(body);
      }
      function wireCardTools(body) {
        const pb = body.querySelector('.pct-box');
        if (pb) drawPct(pb);
        const b = body.querySelector('.card-options');
        if (b && !b.wired) {
          b.wired = true;
          b.addEventListener('click', () => openNamedSheet('pct', b));
        }
      }
      function drawPct(box) {
        const w = box.clientWidth,
          hgt = Math.round(remPx() * (desk.matches ? 15 : 11)),
          mx = 0.12;
        if (!w) return;
        const x = (t) => 34 + ((t - first.t) / (last.t + 60 * DAY - first.t)) * (w - 80);
        const y = (p) => 8 + (1 - p / mx) * (hgt - 30);
        let s = '';
        for (const p of [0, 0.05, 0.1])

        if (APP)
          return `<p>${L('Your weigh-ins stay in this app on your iPhone, and in your iPhone’s backup if you use iCloud Backup or back up to a computer. We keep nothing: no account, no server of ours, no analytics.', 'Suas pesagens ficam neste app, no seu iPhone, e no backup do seu iPhone, se você usa o Backup do iCloud ou faz backup no computador. Nós não guardamos nada: sem conta, sem servidor nosso, sem análise de uso.')}</p>
    <p>${L('If you turn on Apple Health, weights are shared with Health on this iPhone. Ads come from Google AdMob: they are not personalised and never receive your weigh-ins, but Google gets what any ad request carries, such as the iPhone’s model and network address. Removing the ads stops those requests.', 'Se você ligar o app Saúde, os pesos são compartilhados com o Saúde neste iPhone. Os anúncios vêm do Google AdMob: não são personalizados e nunca recebem suas pesagens, mas o Google recebe o que qualquer pedido de anúncio leva, como o modelo do iPhone e o endereço de rede. Remover os anúncios encerra esses pedidos.')}</p>
    <p><a href="https://www.jonathas.net/weightogo/${L('privacy', 'privacidade')}.html">${L('Privacy policy', 'Política de privacidade')}</a></p>`;
        return `<p>${L('Everything runs in your browser: your weigh-ins are stored on this device only.', 'Tudo funciona no seu navegador: suas pesagens ficam guardadas só neste aparelho.')} ${L('No account, no server of ours, no tracking.', 'Sem conta, sem servidor nosso, sem rastreamento.')}</p>`;
      }
      function sectionNames() {
        return [
          L('Key figures', 'Indicadores'),
          L('Main chart', 'Gráfico principal'),
          L('Goal', 'Meta'),
          L('Weekly averages', 'Médias semanais'),
          L('Percentage loss', 'Perda percentual'),
          L('Compound daily rate', 'Taxa diária composta'),
          L('Hiccups', 'Soluços'),
          L('BMI', 'IMC'),
          L('Facts', 'Curiosidades'),
          L('Day-to-day variation', 'Variação de um dia para o outro'),
          L('Weekdays', 'Dias da semana'),
          L('Calendar', 'Calendário'),
          L('Weigh-ins', 'Registros'),
        ];
      }

      // ---------- Sheets: a modal <dialog>; Back closes it on the website ----------
      let opener = null,
        sheetEntry = false;
      function openSheet(title, fill, from, done = L('Done', 'Concluir')) {
        const d = document.getElementById('sheet');
        d.innerHTML = `<div class="sheet-head"><h2 id="sheet-title" tabindex="-1" autofocus>${title}</h2>${done ? `<button class="button button-ghost" type="button" data-close>${done}</button>` : ''}</div><div class="sheet-body"></div>`;
        fill(d.querySelector('.sheet-body'));
        d.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => d.close()));
        opener = from || document.activeElement;
        d.showModal();
        root.classList.add('sheet-open');
        history.pushState({ sheet: true }, '');
        sheetEntry = true;
      }
      const sheetEl = document.getElementById('sheet');
      sheetEl.addEventListener('click', (e) => {
        if (e.target === sheetEl) sheetEl.close();
      });
      sheetEl.addEventListener('close', () => {
        root.classList.remove('sheet-open');
        if (sheetEntry) {
          sheetEntry = false;
          history.back();
        }
        opener?.focus?.({ preventScroll: true });
      });
      addEventListener('popstate', () => {
        if (sheetEl.open) {
          sheetEntry = false;
          sheetEl.close();
        }
      });
      function openNamedSheet(kind, from, arg) {
        if (kind === 'day') {
          const day = days.find((x) => x.t === arg) || last;
          openSheet(
            dfmt(day.t, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }),
            (b) => {
              b.innerHTML = `<form class="entry-form"><label for="day-weight">${L('Weight', 'Peso')}</label><div class="with-unit"><input id="day-weight" inputmode="decimal" value="${num(day.kg)}"><span class="unit">${UNIT}</span></div><button class="button button-big" type="submit">${L('Save', 'Salvar')}</button></form>
        <div class="danger-zone" style="margin-top:28px"><button class="button button-danger" type="button" id="del-day" aria-label="${L(`Delete the weigh-in of ${dShort(day.t)}`, `Apagar a pesagem de ${dShort(day.t)}`)}">${L('Delete', 'Apagar')}</button></div>`;
              b.querySelector('#del-day').addEventListener('click', () => {
                document.getElementById('sheet').close();
                toast(L(`Deleted the weigh-in of ${dShort(day.t)}.`, `Pesagem de ${dShort(day.t)} apagada.`));
              });
            },
            from,
            L('Cancel', 'Cancelar'),
          );
        } else if (kind === 'sections') {
          openSheet(
            L('Sections', 'Seções'),
            (b) => {
              b.innerHTML = `<div class="sheet-section"><div class="toggle-list">${sectionNames()
                .map(
                  (s) =>
                    `<button class="toggle" type="button" aria-pressed="true"><span class="grow">${s}</span><span class="switch" aria-hidden="true"></span></button>`,
                )
                .join('')}</div></div>`;
              b.querySelectorAll('.toggle').forEach((t) =>
                t.addEventListener('click', () =>
                  t.setAttribute('aria-pressed', String(t.getAttribute('aria-pressed') !== 'true')),
                ),
              );
            },
            from,
          );
        } else if (kind === 'paste') {
          // Built paste.* strings, word for word.
          openSheet(
            L('Paste several days at once', 'Colar vários dias de uma vez'),
            (b) => {
              b.innerHTML = `<p class="preset-note" id="paste-help">${L(`One weigh-in per line, a date and a weight, like “19/10 ${num(108.4)}”. Weights are read in ${UNIT} unless a line says kg or lb. Days already logged are replaced.`, `Uma pesagem por linha, com a data e o peso, como “19/10 ${num(108.4)}”. Os pesos são lidos em ${UNIT}, a menos que a linha diga kg ou lb. Dias já registrados são substituídos.`)}</p><label class="visually-hidden" for="paste">${L('Weigh-ins to import', 'Pesagens para importar')}</label><textarea id="paste" rows="6" aria-describedby="paste-help" style="width:100%;margin-top:10px;font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--ref);background:var(--bg);color:var(--fg)"></textarea><button class="button" type="button" style="width:100%;margin-top:10px">${L('Import lines', 'Importar linhas')}</button>`;
            },
            from,
            L('Cancel', 'Cancelar'),
          );
        } else if (kind === 'erase') {
          // Built data.eraseWarning (enApp in the app), data.eraseHealth and data.eraseHealthNote; one Cancel.
          const healthOn = APP && HEALTH !== 'off' && HEALTH !== 'none';
          openSheet(
            L('Erase everything', 'Apagar tudo'),
            (b) => {
              b.innerHTML = `<p>${APP ? L("This erases every weigh-in, your goal, height and settings from this app, and can't be undone. Export a backup first if you may want them back.", 'Isto apaga todas as pesagens, sua meta, altura e configurações deste app, e não pode ser desfeito. Exporte um backup antes, caso queira recuperar tudo.') : L("This erases every weigh-in, your goal, height and settings from this browser, and can't be undone. Export a backup first if you may want them back.", 'Isto apaga todas as pesagens, sua meta, altura e configurações deste navegador, e não pode ser desfeito. Exporte um backup antes, caso queira recuperar tudo.')}</p>
        ${healthOn ? `<label class="check-row"><input type="checkbox" aria-describedby="erase-revoke"> <span>${L('Also delete the weights this app saved in Apple Health', 'Apagar também os pesos que este app salvou no app Saúde')}</span></label><p class="preset-note" id="erase-revoke">${L('Readings from your scale or other apps stay in Apple Health. The app can’t take back its own access to Health: to do it, in the Health app tap your picture, then Apps under Privacy, Weigh to Go.', 'As medições da sua balança ou de outros apps continuam no app Saúde. O app não consegue tirar o próprio acesso ao app Saúde: para isso, no app Saúde toque na sua foto, depois em Apps, em Privacidade, e em Weigh to Go.')}</p>` : ''}
        <div class="stack" style="margin-top:12px"><button class="button button-ghost" type="button">${L('Export backup', 'Exportar backup')}</button><button class="button" type="button" data-close>${L('Cancel', 'Cancelar')}</button><button class="button button-danger" type="button" style="margin-top:12px">${L('Erase', 'Apagar')}</button></div>`;
            },
            from,
            null,
          );
        } else if (kind === 'pct') {
          openSheet(
            L('Percentage loss · options', 'Perda percentual · opções'),
            (b) => {
              b.innerHTML = `<section class="sheet-section"><h3>View</h3><div class="segmented" role="group" aria-label="View"><button type="button" aria-pressed="true">Essential</button><button type="button" aria-pressed="false">Detailed</button><button type="button" aria-pressed="false">Custom</button></div></section>
        <section class="sheet-section"><h3>Show</h3><div class="toggle-list">${['Figures in %', 'Chart', 'Weekly pace in %', 'Milestones table'].map((s, i) => `<button class="toggle" type="button" aria-pressed="${i < 2}"><span class="grow">${s}</span><span class="switch" aria-hidden="true"></span></button>`).join('')}</div></section>
        <section class="sheet-section"><h3>Layers</h3><div class="toggle-list">${['Weigh-ins', '7-day average', 'Trend line', 'Projection', 'Projection range', 'Milestones 5%, 10%, 15%…', 'Goal'].map((s, i) => `<button class="toggle" type="button" aria-pressed="${[0, 1, 3, 6].includes(i)}"><span class="grow">${s}</span><span class="switch" aria-hidden="true"></span></button>`).join('')}</div></section>
        <section class="sheet-section"><h3>Projection</h3><div class="segmented" role="group" aria-label="Projection"><button type="button" aria-pressed="true">Whole period</button><button type="button" aria-pressed="false">Last 3 weeks</button><button type="button" aria-pressed="false">Smoothed trend</button></div></section>
        <section class="sheet-section"><h3>Horizon</h3><div class="segmented" role="group" aria-label="Horizon"><button type="button" aria-pressed="false">15 days</button><button type="button" aria-pressed="false">30 days</button><button type="button" aria-pressed="true">60 days</button><button type="button" aria-pressed="false">90 days</button></div></section>`;
            },
            from,
          );
        }
      }
      let toastTimer;
      function toast(text) {
        const t = document.getElementById('toast');
        t.innerHTML = `<p>${text}</p><button class="button-text" type="button">${L('Undo', 'Desfazer')}</button>`;
        t.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          t.hidden = true;
        }, 10000);
        t.querySelector('button').addEventListener('click', () => {
          t.hidden = true;
        });
      }

      // ---------- Drawing only what shows ----------
      function redrawShown() {
        if (current === 'progress' || desk.matches) drawMain();
        if (current === 'today') drawSpark();
        for (const b of document.querySelectorAll('.pct-box')) if (b.offsetParent) drawPct(b);
      }

      // ---------- Start ----------
      function renderAll() {
        renderToday();
        renderProgress();
        renderAnalysis();
        renderData();
      }
      renderAll();
      const startTab = Q.get('tab') || (ROUTES[location.hash.slice(1)] ? location.hash.slice(1) : 'today');
      show(startTab, false);
      const sheetQ = Q.get('sheet');
      if (sheetQ === 'chart') {
        show('progress');
        toggleChartOptions();
      } else if (sheetQ) openNamedSheet(sheetQ, null, last?.t);
      if ('IntersectionObserver' in window) {
        const io = new IntersectionObserver(
          (entries) => {
            if (!desk.matches) return;
            for (const e of entries)
              if (e.isIntersecting) markCurrent(Object.keys(ROUTES).find((k) => ROUTES[k] === e.target.id));
          },
          { rootMargin: '-80px 0px -60% 0px' },
        );
        Object.values(ROUTES).forEach((id) => io.observe(document.getElementById(id)));
      }
      // Crossing the breakpoint keeps every choice; the prototype re-renders, the product moves nodes (design §1).
      desk.addEventListener('change', () => {
        if (sheetEl.open) sheetEl.close();
        renderAll();
        show(current);
      });
      let rt;
      addEventListener('resize', () => {
        clearTimeout(rt);
        rt = setTimeout(redrawShown, 100);
      });
      document.fonts.ready.then(redrawShown);
    </script>
  </body>
</html>
