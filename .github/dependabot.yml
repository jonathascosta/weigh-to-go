version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it, as a buffer against a compromised version.
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
        # Majors come in pull requests of their own, so one breaking change doesn't hold up the rest.
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only; lift this when it supports more.
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # The Node types follow the oldest Node line `engines` allows (22), so code doesn't use newer APIs.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it, as a buffer against a compromised version.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
