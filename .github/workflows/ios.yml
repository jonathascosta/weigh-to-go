name: iOS

# Builds the iPhone app for the simulator, unsigned and without any secret, runs it there and fails
# when its web view logs a script error, a policy violation or a promise nobody caught, or never
# draws the diary (docs/sprint-3.md, story 1). The owner has no Mac, so this run is the first place
# the app opens. It runs when a change touches the app or the pages it carries: on its pull request
# and again on main after the merge (a macOS minute costs ten if the repository ever goes private).
on:
  push:
    branches: [main]
    # The same paths as pull_request below: keep the two lists alike.
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'scripts/csp.mjs'
      - 'index.html'
      - 'privacy.html'
      - 'pt/**'
      - 'public/**'
      - 'src/**'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'scripts/csp.mjs'
      - 'index.html'
      - 'privacy.html'
      - 'pt/**'
      - 'public/**'
      - 'src/**'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS build and launch (simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      # The app's pages into dist-ios/, then into the Xcode project with its Swift package list.
      - run: npm run ios:sync

      - name: The app's pages carry the policy and no service worker
        run: |
          test ! -e ios/App/App/public/sw.js
          for page in index.html pt/index.html privacy.html pt/privacidade.html; do
            page="ios/App/App/public/$page"
            grep -q 'http-equiv="Content-Security-Policy"' "$page" || { echo "::error::No policy in $page"; exit 1; }
          done

      - run: xcodebuild -version

      # Release is what TestFlight gets; it is built here too, so a Release-only failure shows on
      # the pull request rather than in the owner's TestFlight run.
      - name: Build the app for the simulator (Release)
        working-directory: ios/App
        run: >-
          xcodebuild build
          -project App.xcodeproj
          -scheme App
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO

      # Debug is the one launched below: only a debug build prints the web view's console.
      - name: Build the app for the simulator (Debug)
        working-directory: ios/App
        run: >-
          xcodebuild build
          -project App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO

      # Opens the debug build on an iPhone of the newest iOS the runner has (Trusted Types and the
      # rest of the web view as the app will meet them) and reads what the page logged: Capacitor
      # prints the console in a debug build, and src/diagnostics.ts adds policy violations and
      # promises nobody caught, then the ready line once the diary is drawn. A screenshot of the
      # first screen is kept as an artifact.
      - name: Launch the app in the simulator
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return tuple(int(n) for n in re.findall(r"iOS-(\d+)-(\d+)", runtime)[0])
          runtimes = sorted((r for r in devices if "iOS" in r and any(d["name"].startswith("iPhone") for d in devices[r])), key=version)
          print([d for d in devices[runtimes[-1]] if d["name"].startswith("iPhone")][0]["udid"])')
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch --console-pty "$udid" net.jonathas.weightogo > launch.log 2>&1 &
          pid=$!
          # Waits for the diary to be drawn, up to two minutes: a slow runner (a first boot that
          # migrates data for minutes) can take far longer than a fixed pause. Then a few seconds
          # more, for anything the first moments log after it.
          for _ in $(seq 120); do
            grep -q 'weigh-to-go: ready' launch.log && break
            sleep 1
          done
          sleep 5
          xcrun simctl io "$udid" screenshot first-screen.png
          xcrun simctl terminate "$udid" net.jonathas.weightogo || true
          wait "$pid" || true
          cat launch.log
          grep -q 'WebView loaded' launch.log || { echo '::error::The web view did not load'; exit 1; }
          grep -q 'weigh-to-go: ready' launch.log || { echo '::error::The diary was never drawn'; exit 1; }
          if grep -E '\[error\]|JS ERROR|Policy violation|Unhandled rejection' launch.log; then
            echo '::error::The app logged an error or a policy violation (above)'
            exit 1
          fi

      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-first-screen
          path: first-screen.png
          if-no-files-found: ignore
