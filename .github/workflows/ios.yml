name: iOS

# Builds the iPhone app for the simulator, unsigned and without any secret, runs it there and fails
# when its web view logs a script error, a policy violation or a promise nobody caught, or never
# draws the diary (docs/sprint-3.md, story 1). The owner has no Mac, so this run is the first place
# the app opens. It runs when a change touches the app or the pages it carries: on its pull request
# and again on main after the merge (a macOS minute costs ten if the repository ever goes private).
on:
  push:
    branches: [main]
    # The same paths as pull_request below: keep the two lists alike.
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'scripts/csp.mjs'
      - 'index.html'
      - 'privacy.html'
      - 'pt/**'
      - 'public/**'
      - 'src/**'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'scripts/csp.mjs'
      - 'index.html'
      - 'privacy.html'
      - 'pt/**'
      - 'public/**'
      - 'src/**'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS build and launch (simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts

      # The app's pages into dist-ios/, then into the Xcode project with its Swift package list.
      - run: npm run ios:sync

      - name: The app's pages carry the policy and no service worker
        run: |
          test ! -e ios/App/App/public/sw.js
          for page in index.html pt/index.html privacy.html pt/privacidade.html; do
            page="ios/App/App/public/$page"
            grep -q 'http-equiv="Content-Security-Policy"' "$page" || { echo "::error::No policy in $page"; exit 1; }
          done

      - run: xcodebuild -version

      # Release is what TestFlight gets; it is built here too, so a Release-only failure shows on
      # the pull request rather than in the owner's TestFlight run.
      - name: Build the app for the simulator (Release)
        working-directory: ios/App
        run: >-
          xcodebuild build
          -project App.xcodeproj
          -scheme App
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO

      # The Swift packages as Xcode resolved them: Google's Mobile Ads SDK is pinned exactly by the
      # AdMob plugin, its consent SDK (UMP) only up to the next minor. Printed, and kept with the
      # screenshot, so a version that moves shows here; the file can be committed from the artifact
      # to pin them (decision 134).
      - name: The Swift packages as resolved
        run: |
          found=$(find ios/App -name Package.resolved -not -path '*/build/*' | head -1)
          if [ -z "$found" ]; then echo '::warning::No Package.resolved found'; exit 0; fi
          echo "$found"
          cat "$found"
          mkdir -p resolved && cp "$found" resolved/Package.resolved

      # Debug is the one launched below: only a debug build prints the web view's console.
      - name: Build the app for the simulator (Debug)
        working-directory: ios/App
        run: >-
          xcodebuild build
          -project App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO

      # Opens the debug build on an iPhone of the newest iOS the runner has (Trusted Types and the
      # rest of the web view as the app will meet them) and reads what the page logged: Capacitor
      # prints the console in a debug build, and src/diagnostics.ts adds policy violations and
      # promises nobody caught, then the ready line once the diary is drawn. A screenshot of the
      # first screen is kept as an artifact.
      - name: Launch the app in the simulator
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return tuple(int(n) for n in re.findall(r"iOS-(\d+)-(\d+)", runtime)[0])
          runtimes = sorted((r for r in devices if "iOS" in r and any(d["name"].startswith("iPhone") for d in devices[r])), key=version)
          print([d for d in devices[runtimes[-1]] if d["name"].startswith("iPhone")][0]["udid"])')
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch --console-pty "$udid" net.jonathas.weightogo > launch.log 2>&1 &
          pid=$!
          # Waits for the diary to be drawn, up to five minutes: a slow runner (a first boot that
          # migrates data for minutes) can take far longer than a fixed pause. On 22 October 2026
          # two runs booted for about six minutes ("Waiting on System App") and then didn't draw
          # the diary within two, on changes that touch no app code. Then a few seconds more, for
          # anything the first moments log after it.
          waited=0
          until grep -q 'weigh-to-go: ready' launch.log || [ "$waited" -ge 300 ]; do
            sleep 1
            waited=$((waited + 1))
          done
          echo "Waited ${waited}s for the diary"
          sleep 5
          xcrun simctl io "$udid" screenshot first-screen.png
          xcrun simctl terminate "$udid" net.jonathas.weightogo || true
          wait "$pid" || true
          cat launch.log
          grep -q 'WebView loaded' launch.log || { echo '::error::The web view did not load'; exit 1; }
          grep -q 'weigh-to-go: ready' launch.log || { echo '::error::The diary was never drawn'; exit 1; }
          if grep -E '\[error\]|JS ERROR|Policy violation|Unhandled rejection' launch.log; then
            echo '::error::The app logged an error or a policy violation (above)'
            exit 1
          fi

      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-first-screen
          path: |
            first-screen.png
            resolved/Package.resolved
          if-no-files-found: ignore

  # Remove ads against StoreKit's own test environment (docs/sprint-4.md, story 2; decision 143):
  # AppStoreKitTests, hosted in the app, with ios/App/Products.storekit in an SKTestSession: the
  # product and its price, a verified purchase held in the current entitlements, a refund, Ask to
  # Buy approved and declined. Nothing reaches the App Store.
  # A job of its own, with Xcode 26.2 and its iOS 26.2 simulator from the start: from Xcode 26.3
  # (the runner's default is 26.6, with iOS 26.5), command-line runs get "SKTestSession: Error
  # saving configuration file: SKInternalErrorDomain Code=3" on every call and no product (Apple's
  # FB22237318, said fixed in 26.5 but still there here, unsigned and signed ad hoc). Switching
  # Xcode in the job above, after its simulator had booted, left Xcode 26.2 with no simulator to
  # run on. Try the default Xcode again when a release fixes it. Signed ad hoc ("Sign to Run
  # Locally", no team, no profile), for this run only; TestFlight's archive is unchanged.
  storekit:
    name: Remove ads with StoreKit's test environment (simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.2'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The purchase plugin's Package.swift builds code for the newest StoreKit when the SDK of
      # $DEVELOPER_DIR or of /Applications/Xcode.app has it; the latter is the runner's default
      # Xcode (26.6), whose StoreKit Xcode 26.2 doesn't have. Here both are Xcode 26.2.
      - name: Point /Applications/Xcode.app at Xcode 26.2
        run: |
          set -euo pipefail
          test -L /Applications/Xcode.app
          sudo ln -sfn /Applications/Xcode_26.2.app /Applications/Xcode.app
          echo "DEVELOPER_DIR=/Applications/Xcode_26.2.app/Contents/Developer" >> "$GITHUB_ENV"
          ls -l /Applications/Xcode.app

      - run: npm ci --ignore-scripts

      - run: npm run ios:sync

      - name: Test Remove ads with StoreKit's test environment
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild -version
          # An iPhone on the iOS 26.2 runtime, made if the runner has none.
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for r, ds in devices.items() if r.endswith("iOS-26-2") for d in ds if d["name"].startswith("iPhone")]
          print(phones[0]["udid"] if phones else "")')
          if [ -z "$udid" ]; then
            type=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          types = [t["identifier"] for t in json.load(sys.stdin)["devicetypes"] if t["name"].startswith("iPhone 17")]
          print(types[0])')
            udid=$(xcrun simctl create "StoreKit iPhone" "$type" com.apple.CoreSimulator.SimRuntime.iOS-26-2)
          fi
          xcrun simctl bootstatus "$udid" -b
          xcodebuild test \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination "id=$udid" \
            -derivedDataPath build \
            -only-testing:AppStoreKitTests \
            -resultBundlePath ../../storekit-tests.xcresult \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER=

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storekit-tests
          path: storekit-tests.xcresult
          if-no-files-found: ignore
