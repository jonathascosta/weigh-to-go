name: App Store listing

# Sends the store listing to App Store Connect, by hand from the Actions tab (docs/STORE.md, step
# 8): the text in ios/App/fastlane/metadata and the screenshots in ios/App/fastlane/screenshots
# (`npm run store:screenshots`), in English and Brazilian Portuguese. No build is uploaded and
# nothing is submitted for review. It needs the App Store Connect API key of the TestFlight
# workflow, from the app-store environment (docs/STORE.md, step 3):
#
#   APP_STORE_CONNECT_API_KEY_ID
#   APP_STORE_CONNECT_API_ISSUER_ID
#   APP_STORE_CONNECT_API_KEY_P8      the key's .p8 file, base64
#
# It sends only what is on main. App Store Connect needs the version's App Review Information saved
# once by hand first, or deliver stops with "No data" (docs/STORE.md, step 8).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-store-listing
  cancel-in-progress: false

jobs:
  upload:
    name: Upload the listing
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: app-store
    # The secrets reach only the two steps that need them, never the install or the tests.
    steps:
      - name: Check the secrets
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          missing=()
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_P8; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]} (docs/STORE.md, step 3)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The text's limits and the screenshots' size, checked again before anything is sent.
      - run: npm ci --ignore-scripts
      - run: npx vitest run scripts/listing.test.ts scripts/review.test.ts

      # fastlane and its dependencies at the versions in ios/App/Gemfile.lock.
      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios/App

      - name: Upload the listing
        working-directory: ios/App
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: bundle exec fastlane listing
