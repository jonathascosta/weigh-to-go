name: TestFlight

# Signs the iPhone app for the App Store and uploads it to TestFlight, by hand from the Actions tab
# (docs/STORE.md, step 4). It needs these secrets, the same ones Arrows uses:
#
#   APPLE_TEAM_ID                         the team that owns the app
#   APP_STORE_CONNECT_API_KEY_ID          an App Store Connect API key (App Manager role)
#   APP_STORE_CONNECT_API_ISSUER_ID
#   APP_STORE_CONNECT_API_KEY_P8          the key's .p8 file, base64
#   IOS_DISTRIBUTION_CERTIFICATE_P12      an Apple Distribution certificate with its key, base64
#   IOS_DISTRIBUTION_CERTIFICATE_PASSWORD the .p12's password
#
# and, for the ads (docs/STORE.md, step 6), ADMOB_APP_ID and ADMOB_BANNER_ID. Installed from
# TestFlight the app always shows Google's test ads (it knows TestFlight by its sandbox receipt), so
# the owner's own use never counts as invalid traffic; on the App Store it shows the owner's. Only a
# run "for the App Store" carries the ids (and WTGAppStoreBuild), and it fails without both or
# without Google's SKAdNetwork list in Info.plist, so test ads can't ship; a run without it is for
# TestFlight only, carries no ids, and would show no ads at all on the App Store.
#
# It uploads only what is on main. The job runs in the app-store environment, so its secrets can be
# kept there and limited to main (Settings, Environments) rather than to the whole repository.
on:
  workflow_dispatch:
    inputs:
      app_store:
        description: 'For the App Store: needs the AdMob ids and the SKAdNetwork list (STORE.md, step 6)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Build, sign and upload to TestFlight
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    environment: app-store
    # The secrets reach only the two steps that need them, never the install, the tests or the build.
    steps:
      - name: Check the secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          IOS_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          APP_STORE: ${{ inputs.app_store }}
        run: |
          missing=()
          for name in APPLE_TEAM_ID APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_P8 IOS_DISTRIBUTION_CERTIFICATE_P12 \
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]} (docs/STORE.md, step 3)"
            exit 1
          fi
          # The AdMob ids: both or neither, each in Google's form, and both for the App Store.
          if [ -n "$ADMOB_APP_ID" ] && ! [[ "$ADMOB_APP_ID" =~ ^ca-app-pub-[0-9]+~[0-9]+$ ]]; then
            echo "::error::ADMOB_APP_ID isn't an AdMob app id (ca-app-pub-…~…)"
            exit 1
          fi
          if [ -n "$ADMOB_BANNER_ID" ] && ! [[ "$ADMOB_BANNER_ID" =~ ^ca-app-pub-[0-9]+/[0-9]+$ ]]; then
            echo "::error::ADMOB_BANNER_ID isn't an AdMob ad unit id (ca-app-pub-…/…)"
            exit 1
          fi
          if [ "${ADMOB_APP_ID:+set}" != "${ADMOB_BANNER_ID:+set}" ]; then
            echo "::error::Set ADMOB_APP_ID and ADMOB_BANNER_ID together, or neither (docs/STORE.md, step 6)"
            exit 1
          fi
          if [ "$APP_STORE" = 'true' ]; then
            if [ -z "$ADMOB_APP_ID" ] || [ -z "$ADMOB_BANNER_ID" ]; then
              echo "::error::A build for the App Store needs ADMOB_APP_ID and ADMOB_BANNER_ID (docs/STORE.md, step 6)"
              exit 1
            fi
            case "$ADMOB_APP_ID $ADMOB_BANNER_ID" in
              *ca-app-pub-3940256099942544*)
                echo "::error::A build for the App Store can't use Google's test ids"
                exit 1
                ;;
            esac
          fi

      # Every upload needs a higher build number than the last, a re-run included.
      - name: Number the build
        run: echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Google's list, pasted by the owner into Info.plist (docs/STORE.md, step 6).
      - name: The App Store build carries Google's SKAdNetwork list
        if: inputs.app_store
        run: |
          count=$(python3 -c 'import plistlib; print(len(plistlib.load(open("ios/App/App/Info.plist", "rb"))["SKAdNetworkItems"]))')
          if [ "$count" -eq 0 ]; then
            echo "::error::SKAdNetworkItems in ios/App/App/Info.plist is empty: paste Google's list first (docs/STORE.md, step 6)"
            exit 1
          fi
          echo "SKAdNetworkItems: $count ids"

      - run: npm ci --ignore-scripts
      - run: npx vitest run scripts/ios.test.ts scripts/ads.test.ts
      - run: npm run ios:sync

      - name: The app ships no service worker
        run: test ! -e ios/App/App/public/sw.js

      # fastlane and its dependencies at the versions in ios/App/Gemfile.lock.
      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios/App

      - name: Sign and upload
        working-directory: ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          IOS_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          # The owner's ids only in a run for the App Store: any other build carries none.
          ADMOB_APP_ID: ${{ inputs.app_store && secrets.ADMOB_APP_ID || '' }}
          ADMOB_BANNER_ID: ${{ inputs.app_store && secrets.ADMOB_BANNER_ID || '' }}
          WTG_APP_STORE_BUILD: ${{ inputs.app_store && 'YES' || 'NO' }}
        run: bundle exec fastlane beta

      # What the owner checks before choosing this build for a version (docs/STORE.md, step 11):
      # App Store Connect shows the version and the build number, and this run's summary says which
      # commit of main they were built from, with a link that compares it with main's head now.
      - name: Record the build's commit
        env:
          APP_STORE: ${{ inputs.app_store }}
          REPOSITORY: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          version=$(node -p 'require("./package.json").version')
          {
            echo "## Build $version ($BUILD_NUMBER)"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | $version |"
            echo "| Build number | $BUILD_NUMBER |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| For the App Store | $APP_STORE |"
            echo
            echo "Before choosing this build, open $SERVER/$REPOSITORY/compare/$GITHUB_SHA...main:" \
              "it must say there isn't anything to compare (main hasn't moved since), or list only" \
              "files under docs/, ios/App/fastlane/metadata or ios/App/fastlane/screenshots" \
              "(docs/STORE.md, step 11)."
            echo
            echo "The build still has to finish processing in App Store Connect (a few minutes to" \
              "an hour) before TestFlight offers it and a version can choose it."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Build $version ($BUILD_NUMBER) from $GITHUB_SHA"
