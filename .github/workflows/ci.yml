name: CI & deploy

# Pull requests are checked; pushes to main are checked and deployed to GitHub Pages.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Lint, type-check, test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every Node line package.json's engines allows; the site is deployed from the .nvmrc one.
    strategy:
      matrix:
        node: [22, 24, 26]
        # The line the site is built and deployed from; the first step checks it is the .nvmrc one.
        include:
          - node: 24
            deploy: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the deploying line matches .nvmrc
        if: matrix.deploy
        run: test "$(cat .nvmrc)" = "${{ matrix.node }}"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the built page
        run: npm run check:dist

      - name: Upload site artifact
        if: github.ref == 'refs/heads/main' && matrix.deploy
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # The built site in a real browser: end-to-end tests (offline included), axe on every page in light
  # and dark, desktop and phone, and Lighthouse's scores.
  quality:
    name: End-to-end, axe and Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/lhci/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The Chromium the pinned Playwright (1.63.0) expects, with its system libraries.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: End-to-end tests and axe
        run: npx playwright test

      # Lighthouse CI has its own lockfile in tools/lhci (installed by the script with npm ci), so its
      # CLI's dependencies stay out of the app's. Scores are asserted in lighthouserc.json.
      - name: Lighthouse
        run: npm run lighthouse

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: [check, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
